<circle cx="321.4" cy="193" r="8" class="dot--key"><title>2017 · Shadow Brokers leak — EternalBlue published 14 April 2017.</title></circle>
<text x="321.4" y="173" class="t" font-size="16" font-weight="600" text-anchor="start" dominant-baseline="central">Shadow Brokers leak</text>
<circle cx="326.5" cy="111" r="5" class="dot--muted"><title>2017 · BEC top IC3 loss category — Largest reported loss category every year 2017–2021; overtaken by investment fraud in 2022.</title></circle>
<circle cx="341.8" cy="193" r="5" class="dot--muted"><title>2017 · WannaCry — 12 May 2017.</title></circle>
<circle cx="364.8" cy="439" r="5" class="dot--muted"><title>2017 · JA3 TLS fingerprinting — Salesforce, June 2017.</title></circle>
<circle cx="375.0" cy="193" r="8" class="dot--key"><title>2017 · NotPetya — 27 June 2017; attributed to the Russian military 15 February 2018.</title></circle>
<text x="375.0" y="217" class="t" font-size="16" font-weight="600" text-anchor="start" dominant-baseline="central">NotPetya</text>
<circle cx="431.1" cy="193" r="5" class="dot--muted"><title>2017 · CCleaner supply chain — Disclosed 18 September 2017.</title></circle>
<circle cx="454.0" cy="275" r="5" class="dot--muted"><title>2017 · ASR rules (Windows 10 1709) — Exploit Guard, October 2017.</title></circle>
<circle cx="505.0" cy="111" r="5" class="dot--muted"><title>2018 · Cryptojacking — Monero mining in browsers and on servers.</title></circle>
<circle cx="632.5" cy="439" r="8" class="dot--key"><title>2018 · EDR mainstream; XDR — Detection moves to the host; managed detection and response. XDR as a product from Cortex XDR, February 2019.</title></circle>
<text x="632.5" y="419" class="t" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="central">EDR mainstream; XDR</text>
<circle cx="645.2" cy="357" r="5" class="dot--muted"><title>2018 · Chrome marks HTTP 'Not secure' — Chrome 68, 24 July 2018.</title></circle>
<circle cx="658.0" cy="111" r="8" class="dot--key"><title>2018 · Big-game ransomware — Ryuk from August 2018: the organization pays directly.</title></circle>
<text x="658.0" y="91" class="t" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="central">Big-game ransomware</text>
<circle cx="658.0" cy="193" r="5" class="dot--muted"><title>2018 · Emotet, TrickBot, Ryuk — The 2018–2019 loader-to-ransomware chain.</title></circle>
<circle cx="663.1" cy="357" r="8" class="dot--key"><title>2018 · TLS 1.3 (RFC 8446) — August 2018: the server certificate is encrypted.</title></circle>
<text x="663.1" y="337" class="t" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="central">TLS 1.3 (RFC 8446)</text>
<circle cx="709.0" cy="357" r="5" class="dot--muted"><title>2018 · DNS over HTTPS (RFC 8484) — October 2018.</title></circle>
<circle cx="737.1" cy="439" r="5" class="dot--muted"><title>2018 · ATT&amp;CK Evaluations, round 1 (APT3) — Results published November 2018: EDR products measured technique by technique against one emulated adversary.</title></circle>
<circle cx="760.0" cy="193" r="8" class="dot--key"><title>2019 · Malware-free intrusions pass half — CrowdStrike's yearly reports: malware-free detections 40 percent in 2018, 51 percent in 2019, 62 percent at the end of 2021, 79 percent in 2024. PowerShell, WMI, living-off-the-land binaries, Cobalt Strike, DLL side-loading, memory-only implants.</title></circle>
<text x="760.0" y="173" class="t" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="central">Malware-free intrusions pass half</text>
<circle cx="964.0" cy="275" r="5" class="dot--muted"><title>2019 · Defender tamper protection — GA 14 October 2019.</title></circle>
<circle cx="984.4" cy="111" r="8" class="dot--key"><title>2019 · Double extortion (Maze) — Allied Universal leak threat, November 2019.</title></circle>
<text x="984.4" y="91" class="t" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="central">Double extortion (Maze)</text>
<circle cx="1015.0" cy="193" r="5" class="dot--muted"><title>2020 · Citrix ADC and Pulse Secure VPN exploited — CVE-2019-19781 (disclosed December 2019) and CVE-2019-11510 (2019): edge appliances become an entry point before any host is touched.</title></circle>
<circle cx="1025.2" cy="275" r="5" class="dot--muted"><title>2020 · Windows 7 end of support — 14 January 2020.</title></circle>
<circle cx="1053.3" cy="357" r="5" class="dot--muted"><title>2020 · Firefox DoH default (US) — 25 February 2020.</title></circle>
<circle cx="1091.5" cy="357" r="8" class="dot--key"><title>2020 · Remote work; identity is the perimeter — Cloud-first, OAuth tokens, SaaS everywhere.</title></circle>
<text x="1091.5" y="337" class="t" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="central">Remote work; identity is the perimeter</text>
<circle cx="1168.0" cy="111" r="5" class="dot--muted"><title>2020 · Initial-access brokers, infostealer logs — Access itself becomes the traded commodity.</title></circle>
<circle cx="1168.0" cy="439" r="5" class="dot--muted"><title>2020 · NIST SP 800-207 zero trust — 11 August 2020.</title></circle>
<circle cx="1257.3" cy="193" r="8" class="dot--key"><title>2020 · SolarWinds — SUNBURST disclosed 13 December 2020.</title></circle>
<text x="1257.3" y="173" class="t" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="central">SolarWinds</text>
<circle cx="1267.5" cy="357" r="5" class="dot--muted"><title>2020 · Flash end of life — 31 December 2020: the exploit kits' favourite target is gone.</title></circle>
<circle cx="1313.4" cy="193" r="5" class="dot--muted"><title>2021 · ProxyLogon — 2 March 2021.</title></circle>
<circle cx="1346.5" cy="357" r="5" class="dot--muted"><title>2021 · Chrome on Windows passes 90% HTTPS — April 2021.</title></circle>
<circle cx="1359.2" cy="111" r="8" class="dot--key"><title>2021 · Colonial Pipeline (DarkSide) — 7 May 2021: the pipeline shut down for days; about 75 bitcoin paid, most of it seized by the DOJ in June.</title></circle>
<text x="1359.2" y="91" class="t" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="central">Colonial Pipeline (DarkSide)</text>
<circle cx="1377.1" cy="439" r="5" class="dot--muted"><title>2021 · FireEye sells its products business — 2 June 2021, to Symphony Technology Group for $1.2 billion; VMware had bought Lastline in June 2020. The bookend to the 2013 IPO: the sandbox is a bundled feature now.</title></circle>
<circle cx="1397.5" cy="193" r="5" class="dot--muted"><title>2021 · Kaseya — 2 July 2021.</title></circle>
<circle cx="1463.8" cy="275" r="8" class="dot--key"><title>2021 · Windows 11: TPM 2.0, VBS default — 5 October 2021; virtualization-based security (VBS) on by default for new installs.</title></circle>
<text x="1463.8" y="255" class="t" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="central">Windows 11: TPM 2.0, VBS default</text>
<circle cx="1494.4" cy="193" r="5" class="dot--muted"><title>2021 · Implants in Go and Rust (BlackCat) — BlackCat, the first major ransomware written in Rust, mid-November 2021; Go malware had multiplied through 2020. Still PE files, but each runtime needs its own unpacking, symbol recovery and decompilation.</title></circle>
<circle cx="1509.7" cy="193" r="5" class="dot--muted"><title>2021 · Log4Shell — 9 December 2021.</title></circle>
<circle cx="1525.0" cy="111" r="5" class="dot--muted"><title>2022 · State cryptocurrency heists — North Korean theft at scale.</title></circle>
<circle cx="1558.2" cy="193" r="5" class="dot--muted"><title>2022 · Wipers in Ukraine; Viasat — HermeticWiper on 23 February 2022; KA-SAT modems bricked on 24 February: state sabotage at the start of the invasion.</title></circle>
<circle cx="1570.9" cy="439" r="5" class="dot--muted"><title>2022 · ITDR named (Gartner) — 7 March 2022.</title></circle>
<circle cx="1576.0" cy="193" r="8" class="dot--key"><title>2022 · LAPSUS$ — Okta, Microsoft, Nvidia, early 2022: help desks and MFA fatigue.</title></circle>
<text x="1576.0" y="173" class="t" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="central">LAPSUS$</text>
<circle cx="1665.2" cy="275" r="8" class="dot--key"><title>2022 · Internet macros blocked — Announced February, rolled out July 2022.</title></circle>
<text x="1665.2" y="299" class="t" font-size="16" font-weight="600" text-anchor="end" dominant-baseline="central">Internet macros blocked</text>
<circle cx="1708.6" cy="275" r="5" class="dot--muted"><title>2022 · Driver blocklist on by default — Windows 11 22H2, 20 September 2022.</title></circle>
<circle cx="1711.2" cy="275" r="5" class="dot--muted"><title>2022 · Smart App Control — Windows 11 22H2, September 2022.</title></circle>
<circle cx="1716.2" cy="193" r="8" class="dot--key"><title>2022 · BYOVD EDR killers — Bring your own vulnerable driver: a signed, exploitable driver loaded to switch the EDR off from the kernel. BlackByte, Lazarus, Cuba, 2022.</title></circle>
<text x="1716.2" y="217" class="t" font-size="16" font-weight="600" text-anchor="end" dominant-baseline="central">BYOVD EDR killers</text>
