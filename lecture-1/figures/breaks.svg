<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 420" width="1800" height="420" role="img" aria-label="What broke the file-centric model, and when: six breaks as bars on the 2000 to 2027 axis — Diversification of file types and runtimes; Injection, reflective loading, memory-resident; Living-off-the-land tools; Stolen identities, tokens, cloud APIs; Trusted vendor and update channels; Tool-using agents and external instructions — and, as an inset, the malware-free share of CrowdStrike detections, 40 percent in 2018, 51 in 2019, 62 in 2021, 79 in 2024" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
