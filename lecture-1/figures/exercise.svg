<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 512" width="1800" height="512" role="img" aria-label="Diagnostic exercise: six misses as cards — Case A: A memory-resident payload is missed by an on-write file scanner. Case B: An HTTPS transfer is missed by a plaintext content signature. Case C: A retained PE file is parsed successfully but receives a benign score. Case D: Three low-severity alerts fire on three systems over two days: an unusual sign-in, a PowerShell process, a proxy connection. Each is closed as noise. Case E: The alert is correct and investigated, but isolating the server requires an approval that is unreachable overnight. The upload completes. Case F: Isolation is ordered, but the laptop is off the VPN and the EDR cannot reach it for six hours. — and the pipeline strip below; each answer lights the stage that failed" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<title>Diagnostic exercise: six misses as cards — Case A: A memory-resident payload is missed by an on-write file scanner. Case B: An HTTPS transfer is missed by a plaintext content signature. Case C: A retained PE file is parsed successfully but receives a benign score. Case D: Three low-severity alerts fire on three systems over two days: an unusual sign-in, a PowerShell process, a proxy connection. Each is closed as noise. Case E: The alert is correct and investigated, but isolating the server requires an approval that is unreachable overnight. The upload completes. Case F: Isolation is ordered, but the laptop is off the VPN and the EDR cannot reach it for six hours. — and the pipeline strip below; each answer lights the stage that failed</title>
