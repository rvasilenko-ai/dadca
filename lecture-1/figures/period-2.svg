<rect x="250" y="70" width="1530" height="82" rx="0" class="lane"></rect>
<text x="234" y="111" class="t2" font-size="20" font-weight="700" text-anchor="end" dominant-baseline="central">Motive and money</text>
<rect x="250" y="152" width="1530" height="82" rx="0" class="lane"></rect>
<text x="234" y="193" class="t2" font-size="20" font-weight="700" text-anchor="end" dominant-baseline="central">Attackers</text>
