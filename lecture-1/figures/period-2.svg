<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 540" width="1800" height="540" role="img" aria-label="2010–2016 · APT, exploit kits, files of every kind: the five tracks for these years, key events labelled, every dot with its date on hover; the tracks light up one at a time" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<title>2010–2016 · APT, exploit kits, files of every kind: the five tracks for these years, key events labelled, every dot with its date on hover; the tracks light up one at a time</title>
<style>
