<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From Malware Files to Adversarial Capabilities</title>
<meta name="description" content="Lecture 1 of the Malware and AI series: how malware and malicious capabilities evolved, and how detection pipelines evolved with them.">
<link rel="stylesheet" href="vendor/reveal/reset.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%232a78d6%27/%3E%3Cpath d=%27M7 22V10h3l3.5 6 3.5-6h3v12h-3v-7l-3.5 6-3.5-6v7z%27 fill=%27%23fff%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/reveal/reveal.css">
<link rel="stylesheet" href="theme.css">
<script>
  // Apply the saved theme before first paint so there is no flash.
  try { var t = localStorage.getItem('deck-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
</head>
<body>
<div class="reveal">
  <div class="slides">
{{SECTIONS}}
  </div>
</div>
<div id="tooltip" class="tooltip" role="tooltip" hidden></div>
<div id="help" class="help" hidden>
  <h3>Keys</h3>
  <table>
    <tr><td>→ / Space</td><td>next step</td></tr>
    <tr><td>←</td><td>previous step</td></tr>
    <tr><td>S</td><td>speaker view (notes, timer, next slide)</td></tr>
    <tr><td>F</td><td>fullscreen</td></tr>
    <tr><td>Esc / O</td><td>overview of all slides</td></tr>
    <tr><td>T</td><td>toggle light / dark theme</td></tr>
    <tr><td>B</td><td>blank screen</td></tr>
    <tr><td>?</td><td>this help</td></tr>
  </table>
  <p>PDF: open with <code>?print-pdf</code> in the URL and print to PDF from Chrome.</p>
</div>
<script src="vendor/reveal/reveal.min.js"></script>
<script src="vendor/reveal/plugin/notes/notes.min.js"></script>
<script src="data.js"></script>
<script src="attack.js"></script>
<script src="components.js"></script>
<script>
  Reveal.initialize({
    width: 1280,
    height: 720,
    margin: 0.03,
    minScale: 0.2,
    maxScale: 2.0,
    center: false,
    hash: true,
    history: false,
    controls: true,
    controlsTutorial: false,
    progress: true,
    slideNumber: 'c/t',
    showSlideNumber: 'all',
    transition: 'fade',
    transitionSpeed: 'fast',
    backgroundTransition: 'none',
    pdfSeparateFragments: false,
    plugins: [RevealNotes]
  }).then(function () { Deck.init(); });
</script>
</body>
</html>
