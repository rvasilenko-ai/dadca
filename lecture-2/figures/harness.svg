<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 700" width="1800" height="700" role="img" aria-label="The harness: everything around the model" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<title>The harness: everything around the model</title>
<style>
svg{--surface:#ffffff;--surface-2:#eceff6;--frame:#f8fafc;--ink:#1f2937;--ink-2:#4b5563;--ink-3:#5b6580;--line:#9ca3af;--rule:#cbd5e1;--rule-3:#6c768e;
--acc:#0284c7;--acc-wash:#e0f2fe;--acc-ink:#075985;--bad:#dc2626;--bad-wash:#fee2e2;--bad-ink:#991b1b;
--good:#15803d;--good-wash:#dcfce7;--good-ink:#14532d;--on-badge:#ffffff;
--part-0:#0369a1;--part-1:#b45309;--part-2:#5b3fd0;--part-3:#b91c1c;--part-4:#0f766e}
@media (prefers-color-scheme: dark){svg{--surface:#141a2a;--surface-2:#1b2234;--frame:#10172a;--ink:#eef1f8;--ink-2:#c6cddd;--ink-3:#9aa4ba;--line:#8b96b0;--rule:#344062;--rule-3:#7f8aa6;
--acc:#7cc4ff;--acc-wash:#10304a;--acc-ink:#bfe3ff;--bad:#f87171;--bad-wash:#3b1515;--bad-ink:#fecaca;
--good:#4ade80;--good-wash:#0f2e1c;--good-ink:#bbf7d0;--on-badge:#0b0f1a;
--part-0:#7cc4ff;--part-1:#f0a04b;--part-2:#a78bfa;--part-3:#f87171;--part-4:#2dd4bf}}
.node{fill:var(--surface);stroke:var(--rule);stroke-width:2.5}.node--model{fill:var(--acc-wash);stroke:var(--acc);stroke-width:4}
.node--bad{fill:var(--bad-wash);stroke:var(--bad);stroke-width:4}.node--good{fill:var(--good-wash);stroke:var(--good);stroke-width:4}
.frame{fill:var(--frame);stroke:var(--rule);stroke-width:2.5}.env{fill:none;stroke:var(--line);stroke-width:3;stroke-dasharray:14 10}
.t{fill:var(--ink)}.t2{fill:var(--ink-2)}.t-acc{fill:var(--acc-ink)}.t-bad{fill:var(--bad-ink)}.t-good{fill:var(--good-ink)}.t-badge{fill:var(--on-badge)}
.edge{fill:none;stroke:var(--line);stroke-width:3;stroke-linecap:round}.edge--strong{stroke:var(--ink-2);stroke-width:4}
.edge--bad{stroke:var(--bad);stroke-width:4}.edge--good{stroke:var(--good);stroke-width:4}
.arrow{fill:var(--ink-2)}.arrow--bad{fill:var(--bad)}.arrow--good{fill:var(--good)}
.badge--bad{fill:var(--bad);stroke:var(--surface);stroke-width:3}.badge--good{fill:var(--good);stroke:var(--surface);stroke-width:3}
.ctx-bar{fill:var(--rule)}.ring{fill:none;stroke:var(--ink);stroke-width:4}.dot{fill:var(--ink)}
.axis{stroke:var(--rule-3);stroke-width:2}.grid{stroke:var(--rule);stroke-width:1.5}.lane{fill:var(--surface);stroke:var(--rule);stroke-width:1}
.band-1{fill:var(--part-1);fill-opacity:.11}.band-2{fill:var(--part-2);fill-opacity:.11}.band-3{fill:var(--part-3);fill-opacity:.11}.band-4{fill:var(--part-4);fill-opacity:.11}
.t-part-1{fill:var(--part-1)}.t-part-2{fill:var(--part-2)}.t-part-3{fill:var(--part-3)}.t-part-4{fill:var(--part-4)}
.dot--muted{fill:var(--rule-3)}.dot--key{fill:var(--acc)}.dot--anchor{fill:var(--bad)}
.bar{fill:var(--acc);fill-opacity:.85}.bar--muted{fill:var(--rule)}.bar--bad{fill:var(--bad);fill-opacity:.85}
.line-1{stroke:var(--part-1)}.line-2{stroke:var(--part-2)}.line-3{stroke:var(--part-0)}.line-4{stroke:var(--part-4)}
.line-1,.line-2,.line-3,.line-4{fill:none;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
.pt-1{fill:var(--part-1)}.pt-2{fill:var(--part-2)}.pt-3{fill:var(--part-0)}.pt-4{fill:var(--part-4)}
.cell{fill:var(--surface);stroke:var(--rule);stroke-width:1.5}.cell--sub{fill:var(--surface-2);stroke:var(--rule);stroke-width:1.5}
.cell--lit{fill:var(--bad-wash);stroke:var(--bad);stroke-width:3}.colhead{fill:var(--surface-2);stroke:var(--rule);stroke-width:1.5}
.marker{stroke:var(--ink-3);stroke-width:2;stroke-dasharray:6 6}
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker>
  <marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow arrow--bad"/></marker>
  <marker id="arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow arrow--good"/></marker>
</defs>
<g data-build="0">
<rect x="300" y="10" width="1050" height="680" rx="26" class="frame"/>
<text x="330" y="46" class="t2" font-size="28" font-weight="700" text-anchor="start" dominant-baseline="central">Harness</text>
<rect x="700" y="290" width="260" height="130" rx="18" class="node node--model"/>
<text x="830" y="336" class="t-acc" font-size="36" font-weight="700" text-anchor="middle" dominant-baseline="central">Model</text>
<text x="830" y="382" class="t-acc" font-size="20" font-weight="400" text-anchor="middle" dominant-baseline="central">chooses the next action</text>
</g>
<g data-build="1">
<path d="M985 140L945 290" class="edge draw" pathLength="1"/>
<rect x="985" y="85" width="340" height="110" rx="14" class="node"/>
<text x="1005" y="117" class="t" font-size="22" font-weight="700" text-anchor="start" dominant-baseline="central">Objective and instructions</text>
<text x="1005" y="147" class="t2" font-size="20" font-weight="400" text-anchor="start" dominant-baseline="central">the task and its rules</text>
</g>
<g data-build="2">
<path d="M660 140L715 290" class="edge draw" pathLength="1"/>
<rect x="330" y="85" width="330" height="110" rx="14" class="node"/>
<text x="350" y="117" class="t" font-size="25" font-weight="700" text-anchor="start" dominant-baseline="central">Tools, skills, plugins</text>
<text x="350" y="147" class="t2" font-size="20" font-weight="400" text-anchor="start" dominant-baseline="central">how it acts; its config and hooks</text>
</g>
<g data-build="2">
<path d="M260 140H328" class="edge draw" pathLength="1" marker-end="url(#arrow)"/>
<rect x="40" y="85" width="220" height="110" rx="14" class="node"/>
<text x="60" y="117" class="t" font-size="24" font-weight="700" text-anchor="start" dominant-baseline="central">Tool servers</text>
<text x="60" y="147" class="t2" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="central">MCP, marketplaces</text>
</g>
<g data-build="3">
<path d="M985 570L945 420" class="edge draw" pathLength="1"/>
<rect x="985" y="515" width="340" height="110" rx="14" class="node"/>
<text x="1005" y="547" class="t" font-size="25" font-weight="700" text-anchor="start" dominant-baseline="central">Shell and network</text>
<text x="1005" y="577" class="t2" font-size="20" font-weight="400" text-anchor="start" dominant-baseline="central">where its actions land</text>
<path d="M1440 465H1352" class="edge edge--strong draw" pathLength="1" marker-end="url(#arrow)"/>
<text x="1394" y="490" class="t" font-size="22" font-weight="600" text-anchor="middle" dominant-baseline="central">output</text>
<rect x="1440" y="240" width="340" height="230" rx="18" class="env"/>
<text x="1470" y="280" class="t" font-size="28" font-weight="700" text-anchor="start" dominant-baseline="central">Environment</text>
<text x="1470" y="322" class="t" font-size="22" font-weight="400" text-anchor="start" dominant-baseline="central">files, systems, network:</text>
<text x="1470" y="352" class="t" font-size="22" font-weight="400" text-anchor="start" dominant-baseline="central">the target</text>
<text x="1610" y="430" class="t2" font-size="22" font-weight="500" text-anchor="middle" dominant-baseline="central" font-style="italic">real-world consequences</text>
</g>
<g data-build="3">
<path d="M1350 245H1438" class="edge edge--strong draw" pathLength="1" marker-end="url(#arrow)"/>
<text x="1394" y="222" class="t" font-size="22" font-weight="600" text-anchor="middle" dominant-baseline="central">actions</text>
</g>
<g data-build="4">
<path d="M660 355H698" class="edge draw" pathLength="1"/>
<rect x="330" y="300" width="330" height="110" rx="14" class="node"/>
<text x="350" y="332" class="t" font-size="25" font-weight="700" text-anchor="start" dominant-baseline="central">Retrieval</text>
<text x="350" y="362" class="t2" font-size="20" font-weight="400" text-anchor="start" dominant-baseline="central">what it is fed: documents,</text>
<text x="350" y="388" class="t2" font-size="20" font-weight="400" text-anchor="start" dominant-baseline="central">mail, records, web pages</text>
</g>
<g data-build="4">
<path d="M260 355H328" class="edge draw" pathLength="1" marker-end="url(#arrow)"/>
<rect x="40" y="300" width="220" height="110" rx="14" class="node"/>
<text x="60" y="332" class="t" font-size="24" font-weight="700" text-anchor="start" dominant-baseline="central">Documents</text>
<text x="60" y="362" class="t2" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="central">web, mail, CRM,</text>
<text x="60" y="388" class="t2" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="central">tickets, files</text>
</g>
<g data-build="5">
<path d="M660 570L715 420" class="edge draw" pathLength="1"/>
<rect x="330" y="515" width="330" height="110" rx="14" class="node"/>
<text x="350" y="547" class="t" font-size="25" font-weight="700" text-anchor="start" dominant-baseline="central">Memory and context</text>
<text x="350" y="577" class="t2" font-size="20" font-weight="400" text-anchor="start" dominant-baseline="central">what persists between turns</text>
</g>
<g data-build="6">
<path d="M985 355H962" class="edge draw" pathLength="1"/>
<rect x="985" y="300" width="340" height="110" rx="14" class="node"/>
<text x="1005" y="332" class="t" font-size="22" font-weight="700" text-anchor="start" dominant-baseline="central">Credentials and authority</text>
<text x="1005" y="362" class="t2" font-size="20" font-weight="400" text-anchor="start" dominant-baseline="central">whose identity it acts with</text>
</g>
</svg>
