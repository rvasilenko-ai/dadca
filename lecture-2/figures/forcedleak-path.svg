<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 644" width="1800" height="644" role="img" aria-label="ForcedLeak attack path: instructions an attacker planted in a CRM record are later retrieved by the trusted agent and interpreted as commands, so data leaves with the organization's own authority" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<title>ForcedLeak attack path: instructions an attacker planted in a CRM record are later retrieved by the trusted agent and interpreted as commands, so data leaves with the organization's own authority</title>
<style>
svg{--surface:#ffffff;--frame:#f8fafc;--ink:#1f2937;--ink-2:#4b5563;--line:#9ca3af;--rule:#cbd5e1;
--acc:#0284c7;--acc-wash:#e0f2fe;--acc-ink:#075985;--bad:#dc2626;--bad-wash:#fee2e2;--bad-ink:#991b1b;
--good:#15803d;--good-wash:#dcfce7;--good-ink:#14532d;--on-badge:#ffffff}
@media (prefers-color-scheme: dark){svg{--surface:#141a2a;--frame:#10172a;--ink:#eef1f8;--ink-2:#c6cddd;--line:#8b96b0;--rule:#344062;
--acc:#7cc4ff;--acc-wash:#10304a;--acc-ink:#bfe3ff;--bad:#f87171;--bad-wash:#3b1515;--bad-ink:#fecaca;
--good:#4ade80;--good-wash:#0f2e1c;--good-ink:#bbf7d0;--on-badge:#0b0f1a}}
.node{fill:var(--surface);stroke:var(--rule);stroke-width:2.5}.node--model{fill:var(--acc-wash);stroke:var(--acc);stroke-width:4}
.node--bad{fill:var(--bad-wash);stroke:var(--bad);stroke-width:4}.node--good{fill:var(--good-wash);stroke:var(--good);stroke-width:4}
.frame{fill:var(--frame);stroke:var(--rule);stroke-width:2.5}.env{fill:none;stroke:var(--line);stroke-width:3;stroke-dasharray:14 10}
.t{fill:var(--ink)}.t2{fill:var(--ink-2)}.t-acc{fill:var(--acc-ink)}.t-bad{fill:var(--bad-ink)}.t-good{fill:var(--good-ink)}.t-badge{fill:var(--on-badge)}
.edge{fill:none;stroke:var(--line);stroke-width:3;stroke-linecap:round}.edge--strong{stroke:var(--ink-2);stroke-width:4}
.edge--bad{stroke:var(--bad);stroke-width:4}.edge--good{stroke:var(--good);stroke-width:4}
.arrow{fill:var(--ink-2)}.arrow--bad{fill:var(--bad)}.arrow--good{fill:var(--good)}
.badge--bad{fill:var(--bad);stroke:var(--surface);stroke-width:3}.badge--good{fill:var(--good);stroke:var(--surface);stroke-width:3}
.ctx-bar{fill:var(--rule)}.ring{fill:none;stroke:var(--ink);stroke-width:4}.dot{fill:var(--ink)}
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker>
  <marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow arrow--bad"/></marker>
  <marker id="arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow arrow--good"/></marker>
</defs>
<g data-build="0">
<rect x="280" y="20" width="1240" height="64" rx="14" class="node node--bad"/>
<text x="300" y="52" class="t" font-size="23" font-weight="700" text-anchor="start" dominant-baseline="central">Attacker submits a public Web-to-Lead form</text>
</g>
<g data-build="1">
<path d="M900 84V108" class="edge edge--strong draw" pathLength="1" marker-end="url(#arrow)"/>
<rect x="280" y="110" width="1240" height="64" rx="14" class="node node--bad"/>
<text x="300" y="142" class="t" font-size="23" font-weight="700" text-anchor="start" dominant-baseline="central">Concealed instructions persist in the CRM record</text>
</g>
<g data-build="2">
<path d="M900 174V198" class="edge edge--strong draw" pathLength="1" marker-end="url(#arrow)"/>
<rect x="280" y="200" width="1240" height="64" rx="14" class="node"/>
<text x="300" y="232" class="t" font-size="23" font-weight="700" text-anchor="start" dominant-baseline="central">An employee later asks Agentforce about the lead</text>
</g>
<g data-build="3">
<path d="M900 264V288" class="edge edge--strong draw" pathLength="1" marker-end="url(#arrow)"/>
<rect x="280" y="290" width="1240" height="64" rx="14" class="node"/>
<text x="300" y="322" class="t" font-size="23" font-weight="700" text-anchor="start" dominant-baseline="central">The agent retrieves the attacker-controlled record</text>
</g>
<g data-build="4">
<path d="M900 354V378" class="edge edge--strong draw" pathLength="1" marker-end="url(#arrow)"/>
<rect x="280" y="380" width="1240" height="64" rx="14" class="node node--bad"/>
<text x="300" y="412" class="t" font-size="23" font-weight="700" text-anchor="start" dominant-baseline="central">The record's data is interpreted as instructions</text>
</g>
<g data-build="5">
<path d="M900 444V468" class="edge edge--strong draw" pathLength="1" marker-end="url(#arrow)"/>
<rect x="280" y="470" width="1240" height="64" rx="14" class="node"/>
<text x="300" y="502" class="t" font-size="23" font-weight="700" text-anchor="start" dominant-baseline="central">The agent reaches more CRM data with its authority</text>
</g>
<g data-build="6">
<path d="M900 534V558" class="edge edge--strong draw" pathLength="1" marker-end="url(#arrow)"/>
<rect x="280" y="560" width="1240" height="64" rx="14" class="node node--bad"/>
<text x="300" y="592" class="t" font-size="23" font-weight="700" text-anchor="start" dominant-baseline="central">Sensitive data leaves through crafted image requests</text>
</g>
</svg>
