<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 700" width="1800" height="700" role="img" aria-label="ForcedLeak attack path across three zones: on the Internet the attacker fills a public Web-to-Lead form; the concealed instructions persist in the Salesforce CRM record; inside the organization an employee later asks the Agentforce agent about the lead, the agent retrieves the record, the data is interpreted as instructions, the agent reaches more CRM data with its own authority, and sensitive data leaves through crafted image requests back to the attacker" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<title>ForcedLeak attack path across three zones: on the Internet the attacker fills a public Web-to-Lead form; the concealed instructions persist in the Salesforce CRM record; inside the organization an employee later asks the Agentforce agent about the lead, the agent retrieves the record, the data is interpreted as instructions, the agent reaches more CRM data with its own authority, and sensitive data leaves through crafted image requests back to the attacker</title>
<style>
svg{--surface:#ffffff;--frame:#f8fafc;--ink:#1f2937;--ink-2:#4b5563;--line:#9ca3af;--rule:#cbd5e1;
--acc:#0284c7;--acc-wash:#e0f2fe;--acc-ink:#075985;--bad:#dc2626;--bad-wash:#fee2e2;--bad-ink:#991b1b;
--good:#15803d;--good-wash:#dcfce7;--good-ink:#14532d;--on-badge:#ffffff}
@media (prefers-color-scheme: dark){svg{--surface:#141a2a;--frame:#10172a;--ink:#eef1f8;--ink-2:#c6cddd;--line:#8b96b0;--rule:#344062;
--acc:#7cc4ff;--acc-wash:#10304a;--acc-ink:#bfe3ff;--bad:#f87171;--bad-wash:#3b1515;--bad-ink:#fecaca;
--good:#4ade80;--good-wash:#0f2e1c;--good-ink:#bbf7d0;--on-badge:#0b0f1a}}
.node{fill:var(--surface);stroke:var(--rule);stroke-width:2.5}.node--model{fill:var(--acc-wash);stroke:var(--acc);stroke-width:4}
.node--bad{fill:var(--bad-wash);stroke:var(--bad);stroke-width:4}.node--good{fill:var(--good-wash);stroke:var(--good);stroke-width:4}
.frame{fill:var(--frame);stroke:var(--rule);stroke-width:2.5}.env{fill:none;stroke:var(--line);stroke-width:3;stroke-dasharray:14 10}
.t{fill:var(--ink)}.t2{fill:var(--ink-2)}.t-acc{fill:var(--acc-ink)}.t-bad{fill:var(--bad-ink)}.t-good{fill:var(--good-ink)}.t-badge{fill:var(--on-badge)}
.edge{fill:none;stroke:var(--line);stroke-width:3;stroke-linecap:round}.edge--strong{stroke:var(--ink-2);stroke-width:4}
.edge--bad{stroke:var(--bad);stroke-width:4}.edge--good{stroke:var(--good);stroke-width:4}
.arrow{fill:var(--ink-2)}.arrow--bad{fill:var(--bad)}.arrow--good{fill:var(--good)}
.badge--bad{fill:var(--bad);stroke:var(--surface);stroke-width:3}.badge--good{fill:var(--good);stroke:var(--surface);stroke-width:3}
.ctx-bar{fill:var(--rule)}.ring{fill:none;stroke:var(--ink);stroke-width:4}.dot{fill:var(--ink)}
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker>
  <marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow arrow--bad"/></marker>
  <marker id="arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow arrow--good"/></marker>
</defs>
<g data-build="0">
<rect x="0" y="10" width="560" height="670" rx="22" class="env"/>
<text x="24" y="40" class="t2" font-size="24" font-weight="700" text-anchor="start" dominant-baseline="central">The Internet — the attacker</text>
<rect x="620" y="10" width="560" height="166" rx="22" class="frame"/>
<text x="644" y="40" class="t2" font-size="24" font-weight="700" text-anchor="start" dominant-baseline="central">Salesforce CRM — the record</text>
<rect x="1240" y="136" width="560" height="544" rx="22" class="frame"/>
<text x="1264" y="166" class="t2" font-size="24" font-weight="700" text-anchor="start" dominant-baseline="central">The organization — Agentforce</text>
<text x="280" y="350" class="t-bad" font-size="20" font-weight="500" text-anchor="middle" dominant-baseline="central">red arrow: a trust boundary crossed</text>
<rect x="20" y="60" width="520" height="100" rx="14" class="node node--bad"/>
<text x="40" y="92" class="t" font-size="22" font-weight="700" text-anchor="start" dominant-baseline="central">A public Web-to-Lead form</text>
<text x="40" y="122" class="t-bad" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="central">the attacker submits a lead;</text>
<text x="40" y="148" class="t-bad" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="central">every field is attacker-written text</text>
</g>
<g data-build="1">
<path d="M540 110H636" class="edge edge--bad draw" pathLength="1" marker-end="url(#arrow-bad)"/>
<rect x="640" y="60" width="520" height="100" rx="14" class="node node--bad"/>
<text x="660" y="92" class="t" font-size="22" font-weight="700" text-anchor="start" dominant-baseline="central">Concealed instructions persist</text>
<text x="660" y="122" class="t-bad" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="central">stored in the CRM record,</text>
<text x="660" y="148" class="t-bad" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="central">waiting to be read</text>
</g>
<g data-build="2">
<rect x="1260" y="186" width="520" height="100" rx="14" class="node"/>
<text x="1280" y="218" class="t" font-size="22" font-weight="700" text-anchor="start" dominant-baseline="central">An employee asks about the lead</text>
<text x="1280" y="248" class="t2" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="central">later, in the normal course of work:</text>
<text x="1280" y="274" class="t2" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="central">a legitimate request, a legitimate identity</text>
</g>
<g data-build="3">
<path d="M1520 286V308" class="edge edge--strong draw" pathLength="1" marker-end="url(#arrow)"/>
<path d="M1160 110H1210V362H1256" class="edge edge--bad draw" pathLength="1" marker-end="url(#arrow-bad)"/>
<rect x="1260" y="312" width="520" height="100" rx="14" class="node"/>
<text x="1280" y="344" class="t" font-size="22" font-weight="700" text-anchor="start" dominant-baseline="central">The agent retrieves the record</text>
<text x="1280" y="374" class="t2" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="central">attacker-written text enters</text>
<text x="1280" y="400" class="t2" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="central">the model's context</text>
</g>
<g data-build="4">
<path d="M1520 412V434" class="edge edge--bad draw" pathLength="1" marker-end="url(#arrow-bad)"/>
<rect x="1260" y="438" width="520" height="100" rx="14" class="node node--bad"/>
<text x="1280" y="470" class="t" font-size="22" font-weight="700" text-anchor="start" dominant-baseline="central">Data is interpreted as instructions</text>
<text x="1280" y="500" class="t-bad" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="central">the injection fires inside</text>
<text x="1280" y="526" class="t-bad" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="central">the trusted agent</text>
</g>
<g data-build="5">
<path d="M1520 538V560" class="edge edge--strong draw" pathLength="1" marker-end="url(#arrow)"/>
<rect x="1260" y="564" width="520" height="100" rx="14" class="node"/>
<text x="1280" y="596" class="t" font-size="22" font-weight="700" text-anchor="start" dominant-baseline="central">The agent reaches more CRM data</text>
<text x="1280" y="626" class="t2" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="central">with the organization's</text>
<text x="1280" y="652" class="t2" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="central">own authority</text>
</g>
<g data-build="6">
<path d="M1260 614H544" class="edge edge--bad draw" pathLength="1" marker-end="url(#arrow-bad)"/>
<rect x="20" y="564" width="520" height="100" rx="14" class="node node--bad"/>
<text x="40" y="596" class="t" font-size="22" font-weight="700" text-anchor="start" dominant-baseline="central">Sensitive data leaves</text>
<text x="40" y="626" class="t-bad" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="central">through crafted image requests</text>
<text x="40" y="652" class="t-bad" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="central">to an attacker-controlled domain</text>
</g>
</svg>
