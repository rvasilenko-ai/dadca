<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 600" width="1800" height="600" role="img" aria-label="Where the classic attacks enter a learned model: poisoning and evasion write into the pipeline, extraction and inference read its answers" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<title>Where the classic attacks enter a learned model: poisoning and evasion write into the pipeline, extraction and inference read its answers</title>
<style>
svg{--surface:#ffffff;--frame:#f8fafc;--ink:#1f2937;--ink-2:#4b5563;--line:#9ca3af;--rule:#cbd5e1;
--acc:#0284c7;--acc-wash:#e0f2fe;--acc-ink:#075985;--bad:#dc2626;--bad-wash:#fee2e2;--bad-ink:#991b1b;
--good:#15803d;--good-wash:#dcfce7;--good-ink:#14532d;--on-badge:#ffffff}
@media (prefers-color-scheme: dark){svg{--surface:#141a2a;--frame:#10172a;--ink:#eef1f8;--ink-2:#c6cddd;--line:#8b96b0;--rule:#344062;
--acc:#7cc4ff;--acc-wash:#10304a;--acc-ink:#bfe3ff;--bad:#f87171;--bad-wash:#3b1515;--bad-ink:#fecaca;
--good:#4ade80;--good-wash:#0f2e1c;--good-ink:#bbf7d0;--on-badge:#0b0f1a}}
.node{fill:var(--surface);stroke:var(--rule);stroke-width:2.5}.node--model{fill:var(--acc-wash);stroke:var(--acc);stroke-width:4}
.node--bad{fill:var(--bad-wash);stroke:var(--bad);stroke-width:4}.node--good{fill:var(--good-wash);stroke:var(--good);stroke-width:4}
.frame{fill:var(--frame);stroke:var(--rule);stroke-width:2.5}.env{fill:none;stroke:var(--line);stroke-width:3;stroke-dasharray:14 10}
.t{fill:var(--ink)}.t2{fill:var(--ink-2)}.t-acc{fill:var(--acc-ink)}.t-bad{fill:var(--bad-ink)}.t-good{fill:var(--good-ink)}.t-badge{fill:var(--on-badge)}
.edge{fill:none;stroke:var(--line);stroke-width:3;stroke-linecap:round}.edge--strong{stroke:var(--ink-2);stroke-width:4}
.edge--bad{stroke:var(--bad);stroke-width:4}.edge--good{stroke:var(--good);stroke-width:4}
.arrow{fill:var(--ink-2)}.arrow--bad{fill:var(--bad)}.arrow--good{fill:var(--good)}
.badge--bad{fill:var(--bad);stroke:var(--surface);stroke-width:3}.badge--good{fill:var(--good);stroke:var(--surface);stroke-width:3}
.ctx-bar{fill:var(--rule)}.ring{fill:none;stroke:var(--ink);stroke-width:4}.dot{fill:var(--ink)}
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker>
  <marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow arrow--bad"/></marker>
  <marker id="arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow arrow--good"/></marker>
</defs>
<g data-build="0">
<rect x="80" y="240" width="300" height="110" rx="14" class="node"/>
<text x="230" y="280" class="t" font-size="28" font-weight="700" text-anchor="middle" dominant-baseline="central">training data</text>
<text x="230" y="318" class="t2" font-size="20" font-weight="400" text-anchor="middle" dominant-baseline="central">what it learns from</text>
<rect x="520" y="240" width="300" height="110" rx="14" class="node"/>
<text x="670" y="280" class="t" font-size="28" font-weight="700" text-anchor="middle" dominant-baseline="central">TRAINING</text>
<text x="670" y="318" class="t2" font-size="20" font-weight="400" text-anchor="middle" dominant-baseline="central">fits the function</text>
<rect x="960" y="240" width="300" height="110" rx="18" class="node node--model"/>
<text x="1110" y="280" class="t-acc" font-size="30" font-weight="700" text-anchor="middle" dominant-baseline="central">MODEL</text>
<text x="1110" y="318" class="t-acc" font-size="20" font-weight="400" text-anchor="middle" dominant-baseline="central">the learned function</text>
<rect x="1400" y="240" width="300" height="110" rx="14" class="node"/>
<text x="1550" y="280" class="t" font-size="28" font-weight="700" text-anchor="middle" dominant-baseline="central">predictions</text>
<text x="1550" y="318" class="t2" font-size="20" font-weight="400" text-anchor="middle" dominant-baseline="central">its answers</text>
<path d="M380 295H518" class="edge edge--strong draw" pathLength="1" marker-end="url(#arrow)"/>
<path d="M820 295H958" class="edge edge--strong draw" pathLength="1" marker-end="url(#arrow)"/>
<path d="M1260 295H1398" class="edge edge--strong draw" pathLength="1" marker-end="url(#arrow)"/>
</g>
<g data-build="1">
<text x="80" y="24" class="t-bad" font-size="20" font-weight="600" text-anchor="start" dominant-baseline="central">ATTACKER WRITES: into the data it learns from, or into the input it reads</text>
<rect x="960" y="44" width="340" height="136" rx="14" class="node node--bad"/>
<text x="980" y="76" class="t" font-size="26" font-weight="700" text-anchor="start" dominant-baseline="central">Evasion</text>
<text x="980" y="106" class="t-bad" font-size="19" font-weight="500" text-anchor="start" dominant-baseline="central">perturb the input</text>
<text x="980" y="132" class="t-bad" font-size="19" font-weight="500" text-anchor="start" dominant-baseline="central">2004 → 2014</text>
<text x="980" y="158" class="t-bad" font-size="19" font-weight="500" text-anchor="start" dominant-baseline="central">malware detectors 2013 → 2018</text>
<path d="M1130 180V236" class="edge edge--bad draw" pathLength="1" marker-end="url(#arrow-bad)"/>
</g>
<g data-build="2">
<text x="80" y="578" class="t-bad" font-size="20" font-weight="600" text-anchor="start" dominant-baseline="central">ATTACKER READS: what the model answers, and learns the model or its data from it</text>
<rect x="1040" y="420" width="340" height="136" rx="14" class="node node--bad"/>
<text x="1060" y="452" class="t" font-size="26" font-weight="700" text-anchor="start" dominant-baseline="central">Extraction</text>
<text x="1060" y="482" class="t-bad" font-size="19" font-weight="500" text-anchor="start" dominant-baseline="central">copy the model from its answers</text>
<text x="1060" y="508" class="t-bad" font-size="19" font-weight="500" text-anchor="start" dominant-baseline="central">2005 → 2016</text>
<path d="M1500 350L1240 416" class="edge edge--bad draw" pathLength="1" marker-end="url(#arrow-bad)"/>
</g>
<g data-build="3">
<rect x="80" y="44" width="340" height="136" rx="14" class="node node--bad"/>
<text x="100" y="76" class="t" font-size="26" font-weight="700" text-anchor="start" dominant-baseline="central">Poisoning, backdoors</text>
<text x="100" y="106" class="t-bad" font-size="19" font-weight="500" text-anchor="start" dominant-baseline="central">corrupt what it learns</text>
<text x="100" y="132" class="t-bad" font-size="19" font-weight="500" text-anchor="start" dominant-baseline="central">2008 → 2017</text>
<path d="M250 180V236" class="edge edge--bad draw" pathLength="1" marker-end="url(#arrow-bad)"/>
</g>
<g data-build="4">
<rect x="1420" y="420" width="340" height="136" rx="14" class="node node--bad"/>
<text x="1440" y="452" class="t" font-size="26" font-weight="700" text-anchor="start" dominant-baseline="central">Inference, inversion</text>
<text x="1440" y="482" class="t-bad" font-size="19" font-weight="500" text-anchor="start" dominant-baseline="central">learn the training data</text>
<text x="1440" y="508" class="t-bad" font-size="19" font-weight="500" text-anchor="start" dominant-baseline="central">from its answers · 2014 → 2017</text>
<path d="M1600 350V416" class="edge edge--bad draw" pathLength="1" marker-end="url(#arrow-bad)"/>
</g>
</svg>
