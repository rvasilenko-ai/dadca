<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 620" width="1680" height="620" role="img" aria-label="The agent loop: a model, a harness, and a loop" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<title>The agent loop: a model, a harness, and a loop</title>
<style>
svg{--surface:#ffffff;--frame:#f8fafc;--ink:#1f2937;--ink-2:#4b5563;--line:#9ca3af;--rule:#cbd5e1;
--acc:#0284c7;--acc-wash:#e0f2fe;--acc-ink:#075985;--bad:#dc2626;--bad-wash:#fee2e2;--bad-ink:#991b1b;
--good:#15803d;--good-wash:#dcfce7;--good-ink:#14532d;--on-badge:#ffffff}
@media (prefers-color-scheme: dark){svg{--surface:#141a2a;--frame:#10172a;--ink:#eef1f8;--ink-2:#c6cddd;--line:#8b96b0;--rule:#344062;
--acc:#7cc4ff;--acc-wash:#10304a;--acc-ink:#bfe3ff;--bad:#f87171;--bad-wash:#3b1515;--bad-ink:#fecaca;
--good:#4ade80;--good-wash:#0f2e1c;--good-ink:#bbf7d0;--on-badge:#0b0f1a}}
.node{fill:var(--surface);stroke:var(--rule);stroke-width:2.5}.node--model{fill:var(--acc-wash);stroke:var(--acc);stroke-width:4}
.node--bad{fill:var(--bad-wash);stroke:var(--bad);stroke-width:4}.node--good{fill:var(--good-wash);stroke:var(--good);stroke-width:4}
.frame{fill:var(--frame);stroke:var(--rule);stroke-width:2.5}.env{fill:none;stroke:var(--line);stroke-width:3;stroke-dasharray:14 10}
.t{fill:var(--ink)}.t2{fill:var(--ink-2)}.t-acc{fill:var(--acc-ink)}.t-bad{fill:var(--bad-ink)}.t-good{fill:var(--good-ink)}.t-badge{fill:var(--on-badge)}
.edge{fill:none;stroke:var(--line);stroke-width:3;stroke-linecap:round}.edge--strong{stroke:var(--ink-2);stroke-width:4}
.edge--bad{stroke:var(--bad);stroke-width:4}.edge--good{stroke:var(--good);stroke-width:4}
.arrow{fill:var(--ink-2)}.arrow--bad{fill:var(--bad)}.arrow--good{fill:var(--good)}
.badge--bad{fill:var(--bad);stroke:var(--surface);stroke-width:3}.badge--good{fill:var(--good);stroke:var(--surface);stroke-width:3}
.ctx-bar{fill:var(--rule)}.ring{fill:none;stroke:var(--ink);stroke-width:4}.dot{fill:var(--ink)}
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker>
  <marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow arrow--bad"/></marker>
  <marker id="arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow arrow--good"/></marker>
</defs>
<g data-build="0">
<rect x="390" y="100" width="360" height="190" rx="18" class="node node--model"/>
<text x="570" y="170" class="t-acc" font-size="36" font-weight="700" text-anchor="middle" dominant-baseline="central">Model</text>
<text x="570" y="230" class="t-acc" font-size="24" font-weight="400" text-anchor="middle" dominant-baseline="central">chooses the next action</text>
</g>
<g data-build="1">
<rect x="0" y="130" width="270" height="130" rx="14" class="node"/>
<text x="20" y="162" class="t" font-size="28" font-weight="700" text-anchor="start" dominant-baseline="central">Objective</text>
<text x="20" y="192" class="t2" font-size="22" font-weight="400" text-anchor="start" dominant-baseline="central">the task it was given</text>
<path d="M270 195H380" class="edge draw" pathLength="1" marker-end="url(#arrow)"/>
</g>
<g data-build="2">
<rect x="1110" y="60" width="570" height="530" rx="22" class="env"/>
<text x="1140" y="100" class="t" font-size="28" font-weight="700" text-anchor="start" dominant-baseline="central">Environment</text>
<rect x="1150" y="170" width="490" height="150" rx="14" class="node"/>
<text x="1170" y="202" class="t" font-size="28" font-weight="700" text-anchor="start" dominant-baseline="central">Tools</text>
<text x="1170" y="232" class="t2" font-size="22" font-weight="400" text-anchor="start" dominant-baseline="central">shell, browser, code,</text>
<text x="1170" y="258" class="t2" font-size="22" font-weight="400" text-anchor="start" dominant-baseline="central">any API it is given</text>
<rect x="1150" y="350" width="490" height="130" rx="14" class="node"/>
<text x="1170" y="382" class="t" font-size="28" font-weight="700" text-anchor="start" dominant-baseline="central">The target</text>
<text x="1170" y="412" class="t2" font-size="22" font-weight="400" text-anchor="start" dominant-baseline="central">files, systems, network</text>
<path d="M750 195H1100" class="edge edge--strong draw" pathLength="1" marker-end="url(#arrow)"/>
<text x="925" y="160" class="t" font-size="26" font-weight="600" text-anchor="middle" dominant-baseline="central">Action: a tool call</text>
</g>
<g data-build="3">
<path d="M1110 490H760" class="edge edge--strong draw" pathLength="1" marker-end="url(#arrow)"/>
<text x="935" y="530" class="t" font-size="26" font-weight="600" text-anchor="middle" dominant-baseline="central">Observation: the output</text>
<rect x="390" y="390" width="360" height="200" rx="18" class="node"/>
<text x="420" y="426" class="t" font-size="28" font-weight="700" text-anchor="start" dominant-baseline="central">Context</text>
<rect x="420" y="466" width="300" height="20" rx="4" class="ctx-bar"/>
<path d="M570 390V300" class="edge draw" pathLength="1" marker-end="url(#arrow)"/>
</g>
<g data-build="4">
<rect x="420" y="496" width="300" height="20" rx="4" class="ctx-bar"/>
<rect x="420" y="526" width="300" height="20" rx="4" class="ctx-bar"/>
<rect x="420" y="556" width="140" height="20" rx="4" class="ctx-bar"/>
<text x="575" y="566" class="t2" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="central">grows every turn</text>
</g>
<g data-build="5">
<path d="M390 270L225 415" class="edge draw" pathLength="1" marker-end="url(#arrow)"/>
<circle cx="185" cy="455" r="34" class="ring"/><circle cx="185" cy="455" r="20" class="dot"/>
<text x="185" y="525" class="t" font-size="22" font-weight="600" text-anchor="middle" dominant-baseline="central">Stop when the objective is met</text>
<text x="185" y="555" class="t" font-size="22" font-weight="600" text-anchor="middle" dominant-baseline="central">or the budget runs out</text>
</g>
</svg>
