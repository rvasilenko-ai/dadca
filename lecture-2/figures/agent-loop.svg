<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 640" width="1680" height="640" role="img" aria-label="The agent loop: a model, a harness, and a loop" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title>The agent loop: a model, a harness, and a loop</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4b5563"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker>
</defs>
<rect x="0" y="0" width="1680" height="640" fill="#ffffff"/>
<g data-build="0">
<rect x="390" y="110" width="360" height="190" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="4"/>
<text x="570" y="180" font-size="36" font-weight="700" fill="#075985" text-anchor="middle" dominant-baseline="central">Model</text>
<text x="570" y="240" font-size="24" font-weight="400" fill="#075985" text-anchor="middle" dominant-baseline="central">chooses the next action</text>
</g>
<g data-build="1">
<rect x="0" y="140" width="270" height="130" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5"/>
<text x="20" y="172" font-size="28" font-weight="700" fill="#1f2937" text-anchor="start" dominant-baseline="central">Objective</text>
<text x="20" y="202" font-size="22" font-weight="400" fill="#4b5563" text-anchor="start" dominant-baseline="central">the task it was given</text>
<path d="M270 205H380" fill="none" stroke="#9ca3af" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
</g>
<g data-build="2">
<rect x="1110" y="70" width="570" height="530" rx="22" fill="none" stroke="#9ca3af" stroke-width="3" stroke-dasharray="14 10"/>
<text x="1140" y="110" font-size="28" font-weight="700" fill="#1f2937" text-anchor="start" dominant-baseline="central">Environment</text>
<rect x="1150" y="180" width="490" height="150" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5"/>
<text x="1170" y="212" font-size="28" font-weight="700" fill="#1f2937" text-anchor="start" dominant-baseline="central">Tools</text>
<text x="1170" y="242" font-size="22" font-weight="400" fill="#4b5563" text-anchor="start" dominant-baseline="central">shell, browser, code,</text>
<text x="1170" y="268" font-size="22" font-weight="400" fill="#4b5563" text-anchor="start" dominant-baseline="central">any API it is given</text>
<rect x="1150" y="360" width="490" height="130" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5"/>
<text x="1170" y="392" font-size="28" font-weight="700" fill="#1f2937" text-anchor="start" dominant-baseline="central">The target</text>
<text x="1170" y="422" font-size="22" font-weight="400" fill="#4b5563" text-anchor="start" dominant-baseline="central">files, systems, network</text>
<path d="M750 205H1100" fill="none" stroke="#4b5563" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="925" y="170" font-size="26" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="central">Action: a tool call</text>
</g>
<g data-build="3">
<path d="M1110 500H760" fill="none" stroke="#4b5563" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="935" y="540" font-size="26" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="central">Observation: the output</text>
<rect x="390" y="400" width="360" height="200" rx="18" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2.5"/>
<text x="420" y="436" font-size="28" font-weight="700" fill="#1f2937" text-anchor="start" dominant-baseline="central">Context</text>
<rect x="420" y="476" width="300" height="20" rx="4" fill="#cbd5e1"/>
<path d="M570 400V310" fill="none" stroke="#9ca3af" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
</g>
<g data-build="4">
<rect x="420" y="506" width="300" height="20" rx="4" fill="#cbd5e1"/>
<rect x="420" y="536" width="300" height="20" rx="4" fill="#cbd5e1"/>
<rect x="420" y="566" width="140" height="20" rx="4" fill="#cbd5e1"/>
<text x="575" y="576" font-size="18" font-weight="400" fill="#4b5563" text-anchor="start" dominant-baseline="central">grows every turn</text>
</g>
<g data-build="5">
<path d="M390 280L225 425" fill="none" stroke="#9ca3af" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<circle cx="185" cy="465" r="34" fill="none" stroke="#1f2937" stroke-width="4"/><circle cx="185" cy="465" r="20" fill="#1f2937"/>
<text x="185" y="535" font-size="22" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="central">Stop when the objective is met</text>
<text x="185" y="565" font-size="22" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="central">or the budget runs out</text>
</g>
</svg>
