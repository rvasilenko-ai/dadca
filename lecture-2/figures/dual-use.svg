<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 300" width="1800" height="300" role="img" aria-label="AI pentesting frameworks began as published research, were released open source and model-agnostic, and have since been reported in real intrusions" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<title>AI pentesting frameworks began as published research, were released open source and model-agnostic, and have since been reported in real intrusions</title>
<style>
svg{--surface:#ffffff;--frame:#f8fafc;--ink:#1f2937;--ink-2:#4b5563;--line:#9ca3af;--rule:#cbd5e1;
--acc:#0284c7;--acc-wash:#e0f2fe;--acc-ink:#075985;--bad:#dc2626;--bad-wash:#fee2e2;--bad-ink:#991b1b;
--good:#15803d;--good-wash:#dcfce7;--good-ink:#14532d;--on-badge:#ffffff}
@media (prefers-color-scheme: dark){svg{--surface:#141a2a;--frame:#10172a;--ink:#eef1f8;--ink-2:#c6cddd;--line:#8b96b0;--rule:#344062;
--acc:#7cc4ff;--acc-wash:#10304a;--acc-ink:#bfe3ff;--bad:#f87171;--bad-wash:#3b1515;--bad-ink:#fecaca;
--good:#4ade80;--good-wash:#0f2e1c;--good-ink:#bbf7d0;--on-badge:#0b0f1a}}
.node{fill:var(--surface);stroke:var(--rule);stroke-width:2.5}.node--model{fill:var(--acc-wash);stroke:var(--acc);stroke-width:4}
.node--bad{fill:var(--bad-wash);stroke:var(--bad);stroke-width:4}.node--good{fill:var(--good-wash);stroke:var(--good);stroke-width:4}
.frame{fill:var(--frame);stroke:var(--rule);stroke-width:2.5}.env{fill:none;stroke:var(--line);stroke-width:3;stroke-dasharray:14 10}
.t{fill:var(--ink)}.t2{fill:var(--ink-2)}.t-acc{fill:var(--acc-ink)}.t-bad{fill:var(--bad-ink)}.t-good{fill:var(--good-ink)}.t-badge{fill:var(--on-badge)}
.edge{fill:none;stroke:var(--line);stroke-width:3;stroke-linecap:round}.edge--strong{stroke:var(--ink-2);stroke-width:4}
.edge--bad{stroke:var(--bad);stroke-width:4}.edge--good{stroke:var(--good);stroke-width:4}
.arrow{fill:var(--ink-2)}.arrow--bad{fill:var(--bad)}.arrow--good{fill:var(--good)}
.badge--bad{fill:var(--bad);stroke:var(--surface);stroke-width:3}.badge--good{fill:var(--good);stroke:var(--surface);stroke-width:3}
.ctx-bar{fill:var(--rule)}.ring{fill:none;stroke:var(--ink);stroke-width:4}.dot{fill:var(--ink)}
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker>
  <marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow arrow--bad"/></marker>
  <marker id="arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow arrow--good"/></marker>
</defs>
<g data-build="0">
<rect x="40" y="40" width="520" height="210" rx="14" class="node"/>
<text x="60" y="72" class="t" font-size="23" font-weight="700" text-anchor="start" dominant-baseline="central">PUBLISHED RESEARCH</text>
<text x="60" y="102" class="t2" font-size="20" font-weight="400" text-anchor="start" dominant-baseline="central">autonomous agents that solve</text>
<text x="60" y="128" class="t2" font-size="20" font-weight="400" text-anchor="start" dominant-baseline="central">CTFs, find bugs, red-team nets</text>
<text x="60" y="154" class="t2" font-size="20" font-weight="400" text-anchor="start" dominant-baseline="central">PentestGPT, EnIGMA, D-CIPHER,</text>
<text x="60" y="180" class="t2" font-size="20" font-weight="400" text-anchor="start" dominant-baseline="central">Incalmo; measured on Cybench</text>
</g>
<g data-build="1">
<path d="M560 170L638 170" class="edge edge--strong draw" pathLength="1" marker-end="url(#arrow)"/>
<rect x="640" y="40" width="520" height="210" rx="14" class="node"/>
<text x="660" y="72" class="t" font-size="23" font-weight="700" text-anchor="start" dominant-baseline="central">OPEN SOURCE, MODEL-AGNOSTIC</text>
<text x="660" y="102" class="t2" font-size="20" font-weight="400" text-anchor="start" dominant-baseline="central">anyone can point a released</text>
<text x="660" y="128" class="t2" font-size="20" font-weight="400" text-anchor="start" dominant-baseline="central">framework at any target;</text>
<text x="660" y="154" class="t2" font-size="20" font-weight="400" text-anchor="start" dominant-baseline="central">only the authorization differs</text>
</g>
<g data-build="2">
<path d="M1160 170L1238 170" class="edge edge--bad draw" pathLength="1" marker-end="url(#arrow-bad)"/>
<rect x="1240" y="40" width="520" height="210" rx="14" class="node node--bad"/>
<text x="1260" y="72" class="t" font-size="23" font-weight="700" text-anchor="start" dominant-baseline="central">REPORTED IN INTRUSIONS</text>
<text x="1260" y="102" class="t-bad" font-size="20" font-weight="500" text-anchor="start" dominant-baseline="central">CAIRN — a China-nexus actor,</text>
<text x="1260" y="128" class="t-bad" font-size="20" font-weight="500" text-anchor="start" dominant-baseline="central">~19 orgs, Aug–Sep 2026 (Unit 42)</text>
<text x="1260" y="154" class="t-bad" font-size="20" font-weight="500" text-anchor="start" dominant-baseline="central">PentAGI — scanning across Asia</text>
<text x="1260" y="180" class="t-bad" font-size="20" font-weight="500" text-anchor="start" dominant-baseline="central">HexStrike AI — experimentation</text>
</g>
</svg>
