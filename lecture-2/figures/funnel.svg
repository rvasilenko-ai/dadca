<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 516" width="1800" height="516" role="img" aria-label="Match the model to the scale, for both cases. Two inputs — Case A's endpoint, identity and flow events, and Case B's agent transitions — feed one funnel: encoder-only classifiers at machine scale, small task-trained language models at triage, a frontier model and a human for the few investigations" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<title>Match the model to the scale, for both cases. Two inputs — Case A's endpoint, identity and flow events, and Case B's agent transitions — feed one funnel: encoder-only classifiers at machine scale, small task-trained language models at triage, a frontier model and a human for the few investigations</title>
<style>
svg{--surface:#ffffff;--frame:#f8fafc;--ink:#1f2937;--ink-2:#4b5563;--line:#9ca3af;--rule:#cbd5e1;
--acc:#0284c7;--acc-wash:#e0f2fe;--acc-ink:#075985;--bad:#dc2626;--bad-wash:#fee2e2;--bad-ink:#991b1b;
--good:#15803d;--good-wash:#dcfce7;--good-ink:#14532d;--on-badge:#ffffff}
@media (prefers-color-scheme: dark){svg{--surface:#141a2a;--frame:#10172a;--ink:#eef1f8;--ink-2:#c6cddd;--line:#8b96b0;--rule:#344062;
--acc:#7cc4ff;--acc-wash:#10304a;--acc-ink:#bfe3ff;--bad:#f87171;--bad-wash:#3b1515;--bad-ink:#fecaca;
--good:#4ade80;--good-wash:#0f2e1c;--good-ink:#bbf7d0;--on-badge:#0b0f1a}}
.node{fill:var(--surface);stroke:var(--rule);stroke-width:2.5}.node--model{fill:var(--acc-wash);stroke:var(--acc);stroke-width:4}
.node--bad{fill:var(--bad-wash);stroke:var(--bad);stroke-width:4}.node--good{fill:var(--good-wash);stroke:var(--good);stroke-width:4}
.frame{fill:var(--frame);stroke:var(--rule);stroke-width:2.5}.env{fill:none;stroke:var(--line);stroke-width:3;stroke-dasharray:14 10}
.t{fill:var(--ink)}.t2{fill:var(--ink-2)}.t-acc{fill:var(--acc-ink)}.t-bad{fill:var(--bad-ink)}.t-good{fill:var(--good-ink)}.t-badge{fill:var(--on-badge)}
.edge{fill:none;stroke:var(--line);stroke-width:3;stroke-linecap:round}.edge--strong{stroke:var(--ink-2);stroke-width:4}
.edge--bad{stroke:var(--bad);stroke-width:4}.edge--good{stroke:var(--good);stroke-width:4}
.arrow{fill:var(--ink-2)}.arrow--bad{fill:var(--bad)}.arrow--good{fill:var(--good)}
.badge--bad{fill:var(--bad);stroke:var(--surface);stroke-width:3}.badge--good{fill:var(--good);stroke:var(--surface);stroke-width:3}
.ctx-bar{fill:var(--rule)}.ring{fill:none;stroke:var(--ink);stroke-width:4}.dot{fill:var(--ink)}
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker>
  <marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow arrow--bad"/></marker>
  <marker id="arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow arrow--good"/></marker>
</defs>
<g data-build="0">
<rect x="100" y="10" width="780" height="96" rx="14" class="node"/>
<text x="120" y="42" class="t" font-size="23" font-weight="700" text-anchor="start" dominant-baseline="central">Case A telemetry</text>
<text x="120" y="72" class="t2" font-size="19" font-weight="400" text-anchor="start" dominant-baseline="central">endpoint, identity and flow events — hosts, tokens, API calls, connections</text>
<rect x="920" y="10" width="780" height="96" rx="14" class="node"/>
<text x="940" y="42" class="t" font-size="23" font-weight="700" text-anchor="start" dominant-baseline="central">Case B telemetry</text>
<text x="940" y="72" class="t2" font-size="19" font-weight="400" text-anchor="start" dominant-baseline="central">agent transitions — retrieved texts, tool calls, arguments, destinations</text>
<path d="M490 106V136" class="edge edge--strong draw" pathLength="1" marker-end="url(#arrow)"/>
<path d="M1310 106V136" class="edge edge--strong draw" pathLength="1" marker-end="url(#arrow)"/>
</g>
<g data-build="1">
<rect x="100" y="140" width="1600" height="100" rx="14" class="node"/>
<text x="120" y="172" class="t" font-size="25" font-weight="700" text-anchor="start" dominant-baseline="central">machine scale — millions of events, flows, tool calls, retrieved texts</text>
<text x="120" y="202" class="t2" font-size="19" font-weight="400" text-anchor="start" dominant-baseline="central">encoder-only classifiers (BERT family): fine-tuned on telemetry, line rate, a label — not a sentence</text>
</g>
<g data-build="2">
<path d="M900 240V266" class="edge edge--strong draw" pathLength="1" marker-end="url(#arrow)"/>
<rect x="350" y="270" width="1100" height="100" rx="14" class="node"/>
<text x="370" y="302" class="t" font-size="25" font-weight="700" text-anchor="start" dominant-baseline="central">triage — thousands of candidates</text>
<text x="370" y="332" class="t2" font-size="19" font-weight="400" text-anchor="start" dominant-baseline="central">small language models, 1–8B, trained for the task: summarize, correlate, propose</text>
</g>
<g data-build="3">
<path d="M900 370V396" class="edge edge--strong draw" pathLength="1" marker-end="url(#arrow)"/>
<rect x="600" y="400" width="600" height="100" rx="14" class="node node--model"/>
<text x="620" y="432" class="t-acc" font-size="25" font-weight="700" text-anchor="start" dominant-baseline="central">investigation — a few cases</text>
<text x="620" y="462" class="t-acc" font-size="19" font-weight="400" text-anchor="start" dominant-baseline="central">a frontier model — and a human</text>
</g>
</svg>
