<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 700" width="1800" height="700" role="img" aria-label="MIDNIGHT NEPTUNE path across three zones: on the Internet, a fake recruiter with a model-generated photo and a fake meeting page with a ClickFix lure; inside the organization, a foothold and a pivot into the internal code repositories, where the committed agent settings gain a startup hook; then, for every developer, starting the coding agent on an ordinary morning runs the hook, which downloads the SOMBERMEME backdoor, and GitHub tokens named after Copilot disguise the lateral movement" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<title>MIDNIGHT NEPTUNE path across three zones: on the Internet, a fake recruiter with a model-generated photo and a fake meeting page with a ClickFix lure; inside the organization, a foothold and a pivot into the internal code repositories, where the committed agent settings gain a startup hook; then, for every developer, starting the coding agent on an ordinary morning runs the hook, which downloads the SOMBERMEME backdoor, and GitHub tokens named after Copilot disguise the lateral movement</title>
<style>
