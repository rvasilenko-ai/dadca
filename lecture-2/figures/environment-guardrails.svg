<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 600" width="1800" height="600" role="img" aria-label="Case A guardrails, the environment view. Outside, dashed and not ours to control: the attacker's objective, model and harness. Inside the environment we own, a numbered control and sensor on each component the agent's actions land on: endpoints and edge devices, identity and credentials, workloads and clusters, cloud resources, source control and CI, network and egress; and a monitor M that evaluates every event continuously and correlates across sources" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<title>Case A guardrails, the environment view. Outside, dashed and not ours to control: the attacker's objective, model and harness. Inside the environment we own, a numbered control and sensor on each component the agent's actions land on: endpoints and edge devices, identity and credentials, workloads and clusters, cloud resources, source control and CI, network and egress; and a monitor M that evaluates every event continuously and correlates across sources</title>
<style>
svg{--surface:#ffffff;--frame:#f8fafc;--ink:#1f2937;--ink-2:#4b5563;--line:#9ca3af;--rule:#cbd5e1;
--acc:#0284c7;--acc-wash:#e0f2fe;--acc-ink:#075985;--bad:#dc2626;--bad-wash:#fee2e2;--bad-ink:#991b1b;
--good:#15803d;--good-wash:#dcfce7;--good-ink:#14532d;--on-badge:#ffffff}
@media (prefers-color-scheme: dark){svg{--surface:#141a2a;--frame:#10172a;--ink:#eef1f8;--ink-2:#c6cddd;--line:#8b96b0;--rule:#344062;
--acc:#7cc4ff;--acc-wash:#10304a;--acc-ink:#bfe3ff;--bad:#f87171;--bad-wash:#3b1515;--bad-ink:#fecaca;
--good:#4ade80;--good-wash:#0f2e1c;--good-ink:#bbf7d0;--on-badge:#0b0f1a}}
.node{fill:var(--surface);stroke:var(--rule);stroke-width:2.5}.node--model{fill:var(--acc-wash);stroke:var(--acc);stroke-width:4}
.node--bad{fill:var(--bad-wash);stroke:var(--bad);stroke-width:4}.node--good{fill:var(--good-wash);stroke:var(--good);stroke-width:4}
.frame{fill:var(--frame);stroke:var(--rule);stroke-width:2.5}.env{fill:none;stroke:var(--line);stroke-width:3;stroke-dasharray:14 10}
.t{fill:var(--ink)}.t2{fill:var(--ink-2)}.t-acc{fill:var(--acc-ink)}.t-bad{fill:var(--bad-ink)}.t-good{fill:var(--good-ink)}.t-badge{fill:var(--on-badge)}
.edge{fill:none;stroke:var(--line);stroke-width:3;stroke-linecap:round}.edge--strong{stroke:var(--ink-2);stroke-width:4}
.edge--bad{stroke:var(--bad);stroke-width:4}.edge--good{stroke:var(--good);stroke-width:4}
.arrow{fill:var(--ink-2)}.arrow--bad{fill:var(--bad)}.arrow--good{fill:var(--good)}
.badge--bad{fill:var(--bad);stroke:var(--surface);stroke-width:3}.badge--good{fill:var(--good);stroke:var(--surface);stroke-width:3}
.ctx-bar{fill:var(--rule)}.ring{fill:none;stroke:var(--ink);stroke-width:4}.dot{fill:var(--ink)}
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker>
  <marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow arrow--bad"/></marker>
  <marker id="arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow arrow--good"/></marker>
</defs>
<g data-build="0">
<rect x="0" y="10" width="440" height="520" rx="24" class="env"/>
<text x="24" y="44" class="t2" font-size="24" font-weight="700" text-anchor="start" dominant-baseline="central">Outside — the attacker's</text>
<rect x="24" y="70" width="392" height="100" rx="14" class="node node--bad"/>
<text x="44" y="102" class="t" font-size="23" font-weight="700" text-anchor="start" dominant-baseline="central">Objective</text>
<text x="44" y="132" class="t-bad" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="central">the attacker's success signal</text>
<rect x="24" y="190" width="392" height="100" rx="14" class="node node--bad"/>
<text x="44" y="222" class="t" font-size="23" font-weight="700" text-anchor="start" dominant-baseline="central">Model</text>
<text x="44" y="252" class="t-bad" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="central">any model: commercial, open, stolen</text>
<rect x="24" y="310" width="392" height="100" rx="14" class="node node--bad"/>
<text x="44" y="342" class="t" font-size="23" font-weight="700" text-anchor="start" dominant-baseline="central">Harness</text>
<text x="44" y="372" class="t-bad" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="central">tools, launchpad, C2 — the loop</text>
<text x="220" y="440" class="t-bad" font-size="20" font-weight="500" text-anchor="middle" dominant-baseline="central">not ours to control;</text>
<text x="220" y="466" class="t-bad" font-size="20" font-weight="500" text-anchor="middle" dominant-baseline="central">only its actions reach us</text>
<rect x="520" y="10" width="1280" height="520" rx="24" class="frame"/>
<text x="544" y="44" class="t2" font-size="24" font-weight="700" text-anchor="start" dominant-baseline="central">The environment — ours to instrument and constrain</text>
<rect x="544" y="66" width="596" height="120" rx="14" class="node"/>
<text x="564" y="98" class="t" font-size="23" font-weight="700" text-anchor="start" dominant-baseline="central">Endpoints and edge devices</text>
<text x="564" y="128" class="t2" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="central">every action lands here</text>
<rect x="1180" y="66" width="596" height="120" rx="14" class="node"/>
<text x="1200" y="98" class="t" font-size="23" font-weight="700" text-anchor="start" dominant-baseline="central">Identity and credentials</text>
<text x="1200" y="128" class="t2" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="central">every action lands here</text>
<rect x="544" y="206" width="596" height="120" rx="14" class="node"/>
<text x="564" y="238" class="t" font-size="23" font-weight="700" text-anchor="start" dominant-baseline="central">Workloads and clusters</text>
<text x="564" y="268" class="t2" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="central">every action lands here</text>
<rect x="1180" y="206" width="596" height="120" rx="14" class="node"/>
<text x="1200" y="238" class="t" font-size="23" font-weight="700" text-anchor="start" dominant-baseline="central">Cloud resources</text>
<text x="1200" y="268" class="t2" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="central">every action lands here</text>
<rect x="544" y="346" width="596" height="120" rx="14" class="node"/>
<text x="564" y="378" class="t" font-size="23" font-weight="700" text-anchor="start" dominant-baseline="central">Source control and CI</text>
<text x="564" y="408" class="t2" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="central">every action lands here</text>
<rect x="1180" y="346" width="596" height="120" rx="14" class="node"/>
<text x="1200" y="378" class="t" font-size="23" font-weight="700" text-anchor="start" dominant-baseline="central">Network and egress</text>
<text x="1200" y="408" class="t2" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="central">every action lands here</text>
<path d="M440 126H516" class="edge edge--bad draw" pathLength="1" marker-end="url(#arrow-bad)"/>
<path d="M440 266H516" class="edge edge--bad draw" pathLength="1" marker-end="url(#arrow-bad)"/>
<path d="M440 406H516" class="edge edge--bad draw" pathLength="1" marker-end="url(#arrow-bad)"/>
<text x="478" y="104" class="t-bad" font-size="18" font-weight="600" text-anchor="middle" dominant-baseline="central">actions</text>
</g>
<g data-build="1">
<rect x="544" y="66" width="596" height="120" rx="14" class="node node--good"/>
<text x="564" y="98" class="t" font-size="23" font-weight="700" text-anchor="start" dominant-baseline="central">Endpoints and edge devices</text>
<text x="564" y="128" class="t-good" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="central">EDR, XDR as the sensor; least privilege, patched —</text>
<text x="564" y="154" class="t-good" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="central">the CAIRN intrusions used dated CVEs, default credentials</text>
<circle cx="544" cy="66" r="22" class="badge--good"/>
<text x="544" y="67" class="t-badge" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="central">1</text>
</g>
<g data-build="2">
<rect x="1180" y="66" width="596" height="120" rx="14" class="node node--good"/>
<text x="1200" y="98" class="t" font-size="23" font-weight="700" text-anchor="start" dominant-baseline="central">Identity and credentials</text>
<text x="1200" y="128" class="t-good" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="central">short-lived, scoped, tied to origin; no shared admin —</text>
<text x="1200" y="154" class="t-good" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="central">one superuser connector credential was a root cause</text>
<circle cx="1180" cy="66" r="22" class="badge--good"/>
<text x="1180" y="67" class="t-badge" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="central">2</text>
</g>
<g data-build="3">
<rect x="544" y="206" width="596" height="120" rx="14" class="node node--good"/>
<text x="564" y="238" class="t" font-size="23" font-weight="700" text-anchor="start" dominant-baseline="central">Workloads and clusters</text>
<text x="564" y="268" class="t-good" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="central">no privileged pods (admission policy); metadata blocked;</text>
<text x="564" y="294" class="t-good" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="central">secrets out of environment variables — three root causes</text>
<circle cx="544" cy="206" r="22" class="badge--good"/>
<text x="544" y="207" class="t-badge" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="central">3</text>
</g>
<g data-build="4">
<rect x="1180" y="206" width="596" height="120" rx="14" class="node node--good"/>
<text x="1200" y="238" class="t" font-size="23" font-weight="700" text-anchor="start" dominant-baseline="central">Cloud resources</text>
<text x="1200" y="268" class="t-good" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="central">every API call audited; deny by default; private links —</text>
<text x="1200" y="294" class="t-good" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="central">the denied mutating calls were the controls that held</text>
<circle cx="1180" cy="206" r="22" class="badge--good"/>
<text x="1180" y="207" class="t-badge" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="central">4</text>
</g>
<g data-build="5">
<rect x="544" y="346" width="596" height="120" rx="14" class="node node--good"/>
<text x="564" y="378" class="t" font-size="23" font-weight="700" text-anchor="start" dominant-baseline="central">Source control and CI</text>
<text x="564" y="408" class="t-good" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="central">protected branches; scoped, short-lived app tokens;</text>
<text x="564" y="434" class="t-good" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="central">configuration reviewed as code — the PR that did not ship</text>
<circle cx="544" cy="346" r="22" class="badge--good"/>
<text x="544" y="347" class="t-badge" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="central">5</text>
</g>
<g data-build="6">
<rect x="1180" y="346" width="596" height="120" rx="14" class="node node--good"/>
<text x="1200" y="378" class="t" font-size="23" font-weight="700" text-anchor="start" dominant-baseline="central">Network and egress</text>
<text x="1200" y="408" class="t-good" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="central">NDR, flow logs; egress allowlists; device identity</text>
<text x="1200" y="434" class="t-good" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="central">before the mesh admits a node — not 181 enrollments</text>
<circle cx="1180" cy="346" r="22" class="badge--good"/>
<text x="1180" y="347" class="t-badge" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="central">6</text>
</g>
<g data-build="7">
<circle cx="570" cy="500" r="22" class="badge--good"/>
<text x="570" y="501" class="t-badge" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="central">M</text>
<text x="606" y="500" class="t-good" font-size="22" font-weight="600" text-anchor="start" dominant-baseline="central">M — every event evaluated continuously, correlated across sources: the defender's loop, over all six</text>
<text x="900" y="570" class="t-good" font-size="21" font-weight="500" text-anchor="middle" dominant-baseline="central">green: a control and a sensor at every point the attacker's agent can reach — structure first, correlation second</text>
</g>
</svg>
