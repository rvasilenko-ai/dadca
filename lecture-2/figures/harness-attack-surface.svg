<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 700" width="1800" height="700" role="img" aria-label="The harness under attack: where the attacker reaches in" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<title>The harness under attack: where the attacker reaches in</title>
<style>
svg{--surface:#ffffff;--frame:#f8fafc;--ink:#1f2937;--ink-2:#4b5563;--line:#9ca3af;--rule:#cbd5e1;
--acc:#0284c7;--acc-wash:#e0f2fe;--acc-ink:#075985;--bad:#dc2626;--bad-wash:#fee2e2;--bad-ink:#991b1b;
--good:#15803d;--good-wash:#dcfce7;--good-ink:#14532d;--on-badge:#ffffff}
@media (prefers-color-scheme: dark){svg{--surface:#141a2a;--frame:#10172a;--ink:#eef1f8;--ink-2:#c6cddd;--line:#8b96b0;--rule:#344062;
--acc:#7cc4ff;--acc-wash:#10304a;--acc-ink:#bfe3ff;--bad:#f87171;--bad-wash:#3b1515;--bad-ink:#fecaca;
--good:#4ade80;--good-wash:#0f2e1c;--good-ink:#bbf7d0;--on-badge:#0b0f1a}}
.node{fill:var(--surface);stroke:var(--rule);stroke-width:2.5}.node--model{fill:var(--acc-wash);stroke:var(--acc);stroke-width:4}
.node--bad{fill:var(--bad-wash);stroke:var(--bad);stroke-width:4}.node--good{fill:var(--good-wash);stroke:var(--good);stroke-width:4}
.frame{fill:var(--frame);stroke:var(--rule);stroke-width:2.5}.env{fill:none;stroke:var(--line);stroke-width:3;stroke-dasharray:14 10}
.t{fill:var(--ink)}.t2{fill:var(--ink-2)}.t-acc{fill:var(--acc-ink)}.t-bad{fill:var(--bad-ink)}.t-good{fill:var(--good-ink)}.t-badge{fill:var(--on-badge)}
.edge{fill:none;stroke:var(--line);stroke-width:3;stroke-linecap:round}.edge--strong{stroke:var(--ink-2);stroke-width:4}
.edge--bad{stroke:var(--bad);stroke-width:4}.edge--good{stroke:var(--good);stroke-width:4}
.arrow{fill:var(--ink-2)}.arrow--bad{fill:var(--bad)}.arrow--good{fill:var(--good)}
.badge--bad{fill:var(--bad);stroke:var(--surface);stroke-width:3}.badge--good{fill:var(--good);stroke:var(--surface);stroke-width:3}
.ctx-bar{fill:var(--rule)}.ring{fill:none;stroke:var(--ink);stroke-width:4}.dot{fill:var(--ink)}
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker>
  <marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow arrow--bad"/></marker>
  <marker id="arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow arrow--good"/></marker>
</defs>
<g data-build="0">
<rect x="300" y="10" width="1030" height="680" rx="26" class="frame"/>
<text x="330" y="46" class="t2" font-size="28" font-weight="700" text-anchor="start" dominant-baseline="central">Harness</text>
<rect x="700" y="290" width="260" height="130" rx="18" class="node node--model"/>
<text x="830" y="336" class="t-acc" font-size="36" font-weight="700" text-anchor="middle" dominant-baseline="central">Model</text>
<text x="830" y="382" class="t-acc" font-size="20" font-weight="500" text-anchor="middle" dominant-baseline="central">unchanged, still subverted</text>
</g>
<g data-build="1">
<path d="M985 140L945 290" class="edge"/>
<rect x="985" y="85" width="320" height="110" rx="14" class="node"/>
<text x="1005" y="117" class="t" font-size="25" font-weight="700" text-anchor="start" dominant-baseline="central">Objective and instructions</text>
<text x="1005" y="147" class="t2" font-size="20" font-weight="400" text-anchor="start" dominant-baseline="central">the task and its rules</text>
</g>
<g data-build="2">
<path d="M660 140L715 290" class="edge"/>
<path d="M260 140H328" class="edge edge--bad" marker-end="url(#arrow-bad)"/>
<rect x="330" y="85" width="330" height="110" rx="14" class="node node--bad"/>
<text x="350" y="117" class="t" font-size="25" font-weight="700" text-anchor="start" dominant-baseline="central">Tools, skills, plugins</text>
<text x="350" y="147" class="t-bad" font-size="20" font-weight="500" text-anchor="start" dominant-baseline="central">poisoned skill or hook,</text>
<text x="350" y="173" class="t-bad" font-size="20" font-weight="500" text-anchor="start" dominant-baseline="central">injected tool description</text>
<rect x="40" y="85" width="220" height="110" rx="14" class="node node--bad"/>
<text x="60" y="117" class="t" font-size="24" font-weight="700" text-anchor="start" dominant-baseline="central">Tool servers</text>
<text x="60" y="147" class="t-bad" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="central">compromised server,</text>
<text x="60" y="173" class="t-bad" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="central">supply chain</text>
<circle cx="330" cy="85" r="22" class="badge--bad"/>
<text x="330" y="86" class="t-badge" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="central">1</text>
<circle cx="40" cy="85" r="22" class="badge--bad"/>
<text x="40" y="86" class="t-badge" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="central">4</text>
</g>
<g data-build="3">
<path d="M985 570L945 420" class="edge"/>
<rect x="985" y="515" width="320" height="110" rx="14" class="node"/>
<text x="1005" y="547" class="t" font-size="25" font-weight="700" text-anchor="start" dominant-baseline="central">Shell and network</text>
<text x="1005" y="577" class="t2" font-size="20" font-weight="400" text-anchor="start" dominant-baseline="central">where its actions land</text>
<path d="M1330 245H1418" class="edge edge--strong" marker-end="url(#arrow)"/>
<text x="1374" y="222" class="t" font-size="22" font-weight="600" text-anchor="middle" dominant-baseline="central">actions</text>
<path d="M1420 465H1332" class="edge edge--strong" marker-end="url(#arrow)"/>
<text x="1374" y="490" class="t" font-size="22" font-weight="600" text-anchor="middle" dominant-baseline="central">output</text>
<rect x="1420" y="240" width="360" height="230" rx="18" class="env"/>
<text x="1450" y="280" class="t" font-size="28" font-weight="700" text-anchor="start" dominant-baseline="central">Environment</text>
<text x="1450" y="322" class="t" font-size="22" font-weight="400" text-anchor="start" dominant-baseline="central">files, systems, network:</text>
<text x="1450" y="352" class="t" font-size="22" font-weight="400" text-anchor="start" dominant-baseline="central">the target</text>
<text x="1600" y="430" class="t2" font-size="22" font-weight="500" text-anchor="middle" dominant-baseline="central" font-style="italic">real-world consequences</text>
</g>
<g data-build="4">
<path d="M660 355H698" class="edge"/>
<path d="M260 355H328" class="edge edge--bad" marker-end="url(#arrow-bad)"/>
<rect x="330" y="300" width="330" height="110" rx="14" class="node node--bad"/>
<text x="350" y="332" class="t" font-size="25" font-weight="700" text-anchor="start" dominant-baseline="central">Retrieval</text>
<text x="350" y="362" class="t-bad" font-size="20" font-weight="500" text-anchor="start" dominant-baseline="central">instructions planted</text>
<text x="350" y="388" class="t-bad" font-size="20" font-weight="500" text-anchor="start" dominant-baseline="central">in what it reads</text>
<rect x="40" y="300" width="220" height="110" rx="14" class="node node--bad"/>
<text x="60" y="332" class="t" font-size="24" font-weight="700" text-anchor="start" dominant-baseline="central">Documents</text>
<text x="60" y="362" class="t-bad" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="central">attacker-written</text>
<text x="60" y="388" class="t-bad" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="central">content</text>
<circle cx="330" cy="300" r="22" class="badge--bad"/>
<text x="330" y="301" class="t-badge" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="central">2</text>
</g>
<g data-build="5">
<path d="M660 570L715 420" class="edge"/>
<rect x="330" y="515" width="330" height="110" rx="14" class="node node--bad"/>
<text x="350" y="547" class="t" font-size="25" font-weight="700" text-anchor="start" dominant-baseline="central">Memory and context</text>
<text x="350" y="577" class="t-bad" font-size="20" font-weight="500" text-anchor="start" dominant-baseline="central">malicious context persisted,</text>
<text x="350" y="603" class="t-bad" font-size="20" font-weight="500" text-anchor="start" dominant-baseline="central">replayed on a later task</text>
<circle cx="330" cy="515" r="22" class="badge--bad"/>
<text x="330" y="516" class="t-badge" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="central">3</text>
</g>
<g data-build="6">
<path d="M985 355H962" class="edge"/>
<rect x="985" y="300" width="320" height="110" rx="14" class="node node--bad"/>
<text x="1005" y="332" class="t" font-size="25" font-weight="700" text-anchor="start" dominant-baseline="central">Credentials and authority</text>
<text x="1005" y="362" class="t-bad" font-size="20" font-weight="500" text-anchor="start" dominant-baseline="central">confused or excessive</text>
<text x="1005" y="388" class="t-bad" font-size="20" font-weight="500" text-anchor="start" dominant-baseline="central">delegated permissions</text>
<circle cx="985" cy="300" r="22" class="badge--bad"/>
<text x="985" y="301" class="t-badge" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="central">5</text>
</g>
<g data-build="7">
<rect x="40" y="460" width="220" height="100" rx="14" class="node node--bad"/>
<text x="60" y="492" class="t" font-size="24" font-weight="700" text-anchor="start" dominant-baseline="central">Attacker</text>
<text x="60" y="522" class="t-bad" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="central">never talks</text>
<text x="60" y="548" class="t-bad" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="central">to the model</text>
<path d="M150 458V412" class="edge edge--bad" marker-end="url(#arrow-bad)"/>
<path d="M40 510H22V140H38" class="edge edge--bad" marker-end="url(#arrow-bad)"/>
<text x="1065" y="662" class="t-bad" font-size="21" font-weight="500" text-anchor="middle" dominant-baseline="central">red: a component the attacker can write to — every arrow ends in the model's context</text>
</g>
</svg>
