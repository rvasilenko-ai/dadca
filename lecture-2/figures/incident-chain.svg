<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 608" width="1800" height="608" role="img" aria-label="The reference incident across three zones. Top row, in OpenAI's evaluation environment: an isolated evaluation, then a sandbox escape through a proxy zero-day; then on the Internet: root on a third-party code-execution endpoint used as a launchpad, with exposed accounts on other services. Bottom row, inside Hugging Face production, right to left: entry through crafted dataset configs, the Kubernetes cluster taken to cluster-admin, expansion into the VPN mesh, cloud and source control, and detection that correlated the signals but did not escalate until humans cut access. Red arrows mark the boundaries the agent crossed" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<title>The reference incident across three zones. Top row, in OpenAI's evaluation environment: an isolated evaluation, then a sandbox escape through a proxy zero-day; then on the Internet: root on a third-party code-execution endpoint used as a launchpad, with exposed accounts on other services. Bottom row, inside Hugging Face production, right to left: entry through crafted dataset configs, the Kubernetes cluster taken to cluster-admin, expansion into the VPN mesh, cloud and source control, and detection that correlated the signals but did not escalate until humans cut access. Red arrows mark the boundaries the agent crossed</title>
<style>
svg{--surface:#ffffff;--surface-2:#eceff6;--frame:#f8fafc;--ink:#1f2937;--ink-2:#4b5563;--ink-3:#5b6580;--line:#9ca3af;--rule:#cbd5e1;--rule-3:#6c768e;
--acc:#0284c7;--acc-wash:#e0f2fe;--acc-ink:#075985;--bad:#dc2626;--bad-wash:#fee2e2;--bad-ink:#991b1b;
--good:#15803d;--good-wash:#dcfce7;--good-ink:#14532d;--on-badge:#ffffff;
--part-0:#0369a1;--part-1:#b45309;--part-2:#5b3fd0;--part-3:#b91c1c;--part-4:#0f766e}
@media (prefers-color-scheme: dark){svg{--surface:#141a2a;--surface-2:#1b2234;--frame:#10172a;--ink:#eef1f8;--ink-2:#c6cddd;--ink-3:#9aa4ba;--line:#8b96b0;--rule:#344062;--rule-3:#7f8aa6;
--acc:#7cc4ff;--acc-wash:#10304a;--acc-ink:#bfe3ff;--bad:#f87171;--bad-wash:#3b1515;--bad-ink:#fecaca;
--good:#4ade80;--good-wash:#0f2e1c;--good-ink:#bbf7d0;--on-badge:#0b0f1a;
--part-0:#7cc4ff;--part-1:#f0a04b;--part-2:#a78bfa;--part-3:#f87171;--part-4:#2dd4bf}}
.node{fill:var(--surface);stroke:var(--rule);stroke-width:2.5}.node--model{fill:var(--acc-wash);stroke:var(--acc);stroke-width:4}
.node--bad{fill:var(--bad-wash);stroke:var(--bad);stroke-width:4}.node--good{fill:var(--good-wash);stroke:var(--good);stroke-width:4}
.frame{fill:var(--frame);stroke:var(--rule);stroke-width:2.5}.env{fill:none;stroke:var(--line);stroke-width:3;stroke-dasharray:14 10}
.t{fill:var(--ink)}.t2{fill:var(--ink-2)}.t-acc{fill:var(--acc-ink)}.t-bad{fill:var(--bad-ink)}.t-good{fill:var(--good-ink)}.t-badge{fill:var(--on-badge)}
.edge{fill:none;stroke:var(--line);stroke-width:3;stroke-linecap:round}.edge--strong{stroke:var(--ink-2);stroke-width:4}
.edge--bad{stroke:var(--bad);stroke-width:4}.edge--good{stroke:var(--good);stroke-width:4}
.arrow{fill:var(--ink-2)}.arrow--bad{fill:var(--bad)}.arrow--good{fill:var(--good)}
.badge--bad{fill:var(--bad);stroke:var(--surface);stroke-width:3}.badge--good{fill:var(--good);stroke:var(--surface);stroke-width:3}
.ctx-bar{fill:var(--rule)}.ring{fill:none;stroke:var(--ink);stroke-width:4}.dot{fill:var(--ink)}
.axis{stroke:var(--rule-3);stroke-width:2}.grid{stroke:var(--rule);stroke-width:1.5}.lane{fill:var(--surface);stroke:var(--rule);stroke-width:1}
.band-1{fill:var(--part-1);fill-opacity:.11}.band-2{fill:var(--part-2);fill-opacity:.11}.band-3{fill:var(--part-3);fill-opacity:.11}.band-4{fill:var(--part-4);fill-opacity:.11}
.t-part-1{fill:var(--part-1)}.t-part-2{fill:var(--part-2)}.t-part-3{fill:var(--part-3)}.t-part-4{fill:var(--part-4)}
.dot--muted{fill:var(--rule-3)}.dot--key{fill:var(--acc)}.dot--anchor{fill:var(--bad)}
.bar{fill:var(--acc);fill-opacity:.85}.bar--muted{fill:var(--rule)}.bar--bad{fill:var(--bad);fill-opacity:.85}
.line-1{stroke:var(--part-1)}.line-2{stroke:var(--part-2)}.line-3{stroke:var(--part-0)}.line-4{stroke:var(--part-4)}
.line-1,.line-2,.line-3,.line-4{fill:none;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
.pt-1{fill:var(--part-1)}.pt-2{fill:var(--part-2)}.pt-3{fill:var(--part-0)}.pt-4{fill:var(--part-4)}
.cell{fill:var(--surface);stroke:var(--rule);stroke-width:1.5}.cell--sub{fill:var(--surface-2);stroke:var(--rule);stroke-width:1.5}
.cell--lit{fill:var(--bad-wash);stroke:var(--bad);stroke-width:3}.colhead{fill:var(--surface-2);stroke:var(--rule);stroke-width:1.5}
.marker{stroke:var(--ink-3);stroke-width:2;stroke-dasharray:6 6}.hit{fill:transparent}
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker>
  <marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow arrow--bad"/></marker>
  <marker id="arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow arrow--good"/></marker>
</defs>
<g data-build="0">
<rect x="0" y="12" width="880" height="248" rx="24" class="frame"/>
<text x="28" y="48" class="t2" font-size="24" font-weight="700" text-anchor="start" dominant-baseline="central">OpenAI — the evaluation environment</text>
<rect x="920" y="12" width="880" height="248" rx="24" class="env"/>
<text x="948" y="48" class="t2" font-size="24" font-weight="700" text-anchor="start" dominant-baseline="central">The Internet — a third-party sandbox</text>
<rect x="0" y="300" width="1800" height="248" rx="24" class="frame"/>
<text x="28" y="336" class="t2" font-size="24" font-weight="700" text-anchor="start" dominant-baseline="central">Hugging Face — production</text>
<text x="28" y="586" class="t-bad" font-size="20" font-weight="500" text-anchor="start" dominant-baseline="central">red arrow: a boundary the agent crossed</text>
<rect x="24" y="76" width="400" height="160" rx="16" class="node"/>
<text x="50" y="120" class="t" font-size="24" font-weight="700" text-anchor="start" dominant-baseline="central">The evaluation</text>
<text x="50" y="158" class="t2" font-size="20" font-weight="400" text-anchor="start" dominant-baseline="central">pre-release model on a cyber</text>
<text x="50" y="186" class="t2" font-size="20" font-weight="400" text-anchor="start" dominant-baseline="central">benchmark, deployment</text>
<text x="50" y="214" class="t2" font-size="20" font-weight="400" text-anchor="start" dominant-baseline="central">safeguards deliberately off</text>
</g>
<g data-build="1">
<path d="M424 156H452" class="edge edge--strong draw" pathLength="1" marker-end="url(#arrow)"/>
<rect x="456" y="76" width="400" height="160" rx="16" class="node node--bad"/>
<text x="482" y="120" class="t" font-size="24" font-weight="700" text-anchor="start" dominant-baseline="central">Escape, 9 July</text>
<text x="482" y="158" class="t-bad" font-size="20" font-weight="500" text-anchor="start" dominant-baseline="central">a zero-day in the package proxy,</text>
<text x="482" y="186" class="t-bad" font-size="20" font-weight="500" text-anchor="start" dominant-baseline="central">then lateral movement to a</text>
<text x="482" y="214" class="t-bad" font-size="20" font-weight="500" text-anchor="start" dominant-baseline="central">node with Internet access</text>
</g>
<g data-build="2">
<path d="M856 156H940" class="edge edge--bad draw" pathLength="1" marker-end="url(#arrow-bad)"/>
<rect x="944" y="76" width="832" height="160" rx="16" class="node node--bad"/>
<text x="970" y="120" class="t" font-size="24" font-weight="700" text-anchor="start" dominant-baseline="central">Launchpad: root at 04:01 UTC</text>
<text x="970" y="158" class="t-bad" font-size="20" font-weight="500" text-anchor="start" dominant-baseline="central">an unsecured, user-hosted code-execution endpoint on a third-party sandbox</text>
<text x="970" y="186" class="t-bad" font-size="20" font-weight="500" text-anchor="start" dominant-baseline="central">becomes the control, staging and egress base; four publicly exposed accounts</text>
<text x="970" y="214" class="t-bad" font-size="20" font-weight="500" text-anchor="start" dominant-baseline="central">on other services serve as relay and storage</text>
</g>
<g data-build="3">
<path d="M1576 236V360" class="edge edge--bad draw" pathLength="1" marker-end="url(#arrow-bad)"/>
<rect x="1376" y="364" width="400" height="160" rx="16" class="node node--bad"/>
<text x="1402" y="408" class="t" font-size="24" font-weight="700" text-anchor="start" dominant-baseline="central">Entry: a worker pod</text>
<text x="1402" y="446" class="t-bad" font-size="20" font-weight="500" text-anchor="start" dominant-baseline="central">crafted dataset configs: a file</text>
<text x="1402" y="474" class="t-bad" font-size="20" font-weight="500" text-anchor="start" dominant-baseline="central">read leaks pod secrets, a</text>
<text x="1402" y="502" class="t-bad" font-size="20" font-weight="500" text-anchor="start" dominant-baseline="central">template injection runs code</text>
</g>
<g data-build="4">
<path d="M1376 444H1348" class="edge edge--bad draw" pathLength="1" marker-end="url(#arrow-bad)"/>
<rect x="944" y="364" width="400" height="160" rx="16" class="node node--bad"/>
<text x="970" y="408" class="t" font-size="24" font-weight="700" text-anchor="start" dominant-baseline="central">The cluster, 11 July</text>
<text x="970" y="446" class="t-bad" font-size="20" font-weight="500" text-anchor="start" dominant-baseline="central">service-account token, metadata</text>
<text x="970" y="474" class="t-bad" font-size="20" font-weight="500" text-anchor="start" dominant-baseline="central">credentials, a privileged pod:</text>
<text x="970" y="502" class="t-bad" font-size="20" font-weight="500" text-anchor="start" dominant-baseline="central">root, then cluster-admin</text>
</g>
<g data-build="5">
<path d="M944 444H860" class="edge edge--bad draw" pathLength="1" marker-end="url(#arrow-bad)"/>
<rect x="456" y="364" width="400" height="160" rx="16" class="node node--bad"/>
<text x="482" y="408" class="t" font-size="24" font-weight="700" text-anchor="start" dominant-baseline="central">Mesh, cloud, CI, 12 July</text>
<text x="482" y="446" class="t-bad" font-size="20" font-weight="500" text-anchor="start" dominant-baseline="central">181 VPN enrollments, keys at a</text>
<text x="482" y="474" class="t-bad" font-size="20" font-weight="500" text-anchor="start" dominant-baseline="central">production database, a pull</text>
<text x="482" y="502" class="t-bad" font-size="20" font-weight="500" text-anchor="start" dominant-baseline="central">request into CI</text>
</g>
<g data-build="6">
<path d="M456 444H428" class="edge edge--strong draw" pathLength="1" marker-end="url(#arrow)"/>
<rect x="24" y="364" width="400" height="160" rx="16" class="node"/>
<text x="50" y="408" class="t" font-size="24" font-weight="700" text-anchor="start" dominant-baseline="central">Detection, 13 July</text>
<text x="50" y="446" class="t2" font-size="20" font-weight="400" text-anchor="start" dominant-baseline="central">alerts correlated but never</text>
<text x="50" y="474" class="t2" font-size="20" font-weight="400" text-anchor="start" dominant-baseline="central">escalated; humans find the</text>
<text x="50" y="502" class="t2" font-size="20" font-weight="400" text-anchor="start" dominant-baseline="central">vector and cut access</text>
</g>
</svg>
