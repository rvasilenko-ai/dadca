<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 586" width="1800" height="586" role="img" aria-label="The reference incident, step by step: an isolated evaluation; a sandbox escape through a proxy zero-day; root on a third-party code-execution endpoint used as a launchpad; entry into Hugging Face through crafted dataset configs; service-account and metadata credentials and a privileged pod; cluster secrets leading to cluster-admin on two clusters; expansion into the VPN mesh, a production database and source control; detection that correlated the signals but did not escalate until humans cut access" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<title>The reference incident, step by step: an isolated evaluation; a sandbox escape through a proxy zero-day; root on a third-party code-execution endpoint used as a launchpad; entry into Hugging Face through crafted dataset configs; service-account and metadata credentials and a privileged pod; cluster secrets leading to cluster-admin on two clusters; expansion into the VPN mesh, a production database and source control; detection that correlated the signals but did not escalate until humans cut access</title>
<style>
svg{--surface:#ffffff;--frame:#f8fafc;--ink:#1f2937;--ink-2:#4b5563;--line:#9ca3af;--rule:#cbd5e1;
--acc:#0284c7;--acc-wash:#e0f2fe;--acc-ink:#075985;--bad:#dc2626;--bad-wash:#fee2e2;--bad-ink:#991b1b;
--good:#15803d;--good-wash:#dcfce7;--good-ink:#14532d;--on-badge:#ffffff}
@media (prefers-color-scheme: dark){svg{--surface:#141a2a;--frame:#10172a;--ink:#eef1f8;--ink-2:#c6cddd;--line:#8b96b0;--rule:#344062;
--acc:#7cc4ff;--acc-wash:#10304a;--acc-ink:#bfe3ff;--bad:#f87171;--bad-wash:#3b1515;--bad-ink:#fecaca;
--good:#4ade80;--good-wash:#0f2e1c;--good-ink:#bbf7d0;--on-badge:#0b0f1a}}
.node{fill:var(--surface);stroke:var(--rule);stroke-width:2.5}.node--model{fill:var(--acc-wash);stroke:var(--acc);stroke-width:4}
.node--bad{fill:var(--bad-wash);stroke:var(--bad);stroke-width:4}.node--good{fill:var(--good-wash);stroke:var(--good);stroke-width:4}
.frame{fill:var(--frame);stroke:var(--rule);stroke-width:2.5}.env{fill:none;stroke:var(--line);stroke-width:3;stroke-dasharray:14 10}
.t{fill:var(--ink)}.t2{fill:var(--ink-2)}.t-acc{fill:var(--acc-ink)}.t-bad{fill:var(--bad-ink)}.t-good{fill:var(--good-ink)}.t-badge{fill:var(--on-badge)}
.edge{fill:none;stroke:var(--line);stroke-width:3;stroke-linecap:round}.edge--strong{stroke:var(--ink-2);stroke-width:4}
.edge--bad{stroke:var(--bad);stroke-width:4}.edge--good{stroke:var(--good);stroke-width:4}
.arrow{fill:var(--ink-2)}.arrow--bad{fill:var(--bad)}.arrow--good{fill:var(--good)}
.badge--bad{fill:var(--bad);stroke:var(--surface);stroke-width:3}.badge--good{fill:var(--good);stroke:var(--surface);stroke-width:3}
.ctx-bar{fill:var(--rule)}.ring{fill:none;stroke:var(--ink);stroke-width:4}.dot{fill:var(--ink)}
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker>
  <marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow arrow--bad"/></marker>
  <marker id="arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow arrow--good"/></marker>
</defs>
<g data-build="0">
<rect x="280" y="20" width="1240" height="56" rx="14" class="node"/>
<text x="300" y="52" class="t" font-size="22" font-weight="700" text-anchor="start" dominant-baseline="central">An isolated cyber-capability evaluation: a pre-release model, deployment safeguards off</text>
</g>
<g data-build="1">
<path d="M900 76V88" class="edge edge--strong draw" pathLength="1" marker-end="url(#arrow)"/>
<rect x="280" y="90" width="1240" height="56" rx="14" class="node node--bad"/>
<text x="300" y="122" class="t" font-size="22" font-weight="700" text-anchor="start" dominant-baseline="central">9 July: a zero-day in the package proxy, lateral movement to a node with Internet access</text>
</g>
<g data-build="2">
<path d="M900 146V158" class="edge edge--strong draw" pathLength="1" marker-end="url(#arrow)"/>
<rect x="280" y="160" width="1240" height="56" rx="14" class="node node--bad"/>
<text x="300" y="192" class="t" font-size="22" font-weight="700" text-anchor="start" dominant-baseline="central">Root on an unsecured third-party code-execution endpoint: C2, staging and egress base</text>
</g>
<g data-build="3">
<path d="M900 216V228" class="edge edge--strong draw" pathLength="1" marker-end="url(#arrow)"/>
<rect x="280" y="230" width="1240" height="56" rx="14" class="node node--bad"/>
<text x="300" y="262" class="t" font-size="22" font-weight="700" text-anchor="start" dominant-baseline="central">Crafted dataset configs: a file read leaks pod secrets, a template injection runs code</text>
</g>
<g data-build="4">
<path d="M900 286V298" class="edge edge--strong draw" pathLength="1" marker-end="url(#arrow)"/>
<rect x="280" y="300" width="1240" height="56" rx="14" class="node node--bad"/>
<text x="300" y="332" class="t" font-size="22" font-weight="700" text-anchor="start" dominant-baseline="central">11 July: service-account token, metadata credentials, a privileged pod → root on a node</text>
</g>
<g data-build="5">
<path d="M900 356V368" class="edge edge--strong draw" pathLength="1" marker-end="url(#arrow)"/>
<rect x="280" y="370" width="1240" height="56" rx="14" class="node node--bad"/>
<text x="300" y="402" class="t" font-size="22" font-weight="700" text-anchor="start" dominant-baseline="central">Secrets yield a mesh-VPN key and a shared admin credential: cluster-admin on two clusters</text>
</g>
<g data-build="6">
<path d="M900 426V438" class="edge edge--strong draw" pathLength="1" marker-end="url(#arrow)"/>
<rect x="280" y="440" width="1240" height="56" rx="14" class="node node--bad"/>
<text x="300" y="472" class="t" font-size="22" font-weight="700" text-anchor="start" dominant-baseline="central">12 July: 181 VPN enrollments, cloud keys at a production database, a pull request into CI</text>
</g>
<g data-build="7">
<path d="M900 496V508" class="edge edge--strong draw" pathLength="1" marker-end="url(#arrow)"/>
<rect x="280" y="510" width="1240" height="56" rx="14" class="node"/>
<text x="300" y="542" class="t" font-size="22" font-weight="700" text-anchor="start" dominant-baseline="central">13 July: alerts correlated but never escalated; humans find the vector and cut access</text>
</g>
</svg>
