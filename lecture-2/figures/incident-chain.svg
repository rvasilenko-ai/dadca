<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 700" width="1800" height="700" role="img" aria-label="The reference incident across three zones. In OpenAI's evaluation environment: an isolated evaluation, then a sandbox escape through a proxy zero-day. On the Internet: root on a third-party code-execution endpoint used as a launchpad, plus exposed accounts on other services. Inside Hugging Face production: entry through crafted dataset configs, the Kubernetes cluster taken to cluster-admin, expansion into the VPN mesh, cloud and source control, and detection that correlated the signals but did not escalate until humans cut access" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<title>The reference incident across three zones. In OpenAI's evaluation environment: an isolated evaluation, then a sandbox escape through a proxy zero-day. On the Internet: root on a third-party code-execution endpoint used as a launchpad, plus exposed accounts on other services. Inside Hugging Face production: entry through crafted dataset configs, the Kubernetes cluster taken to cluster-admin, expansion into the VPN mesh, cloud and source control, and detection that correlated the signals but did not escalate until humans cut access</title>
<style>
svg{--surface:#ffffff;--frame:#f8fafc;--ink:#1f2937;--ink-2:#4b5563;--line:#9ca3af;--rule:#cbd5e1;
--acc:#0284c7;--acc-wash:#e0f2fe;--acc-ink:#075985;--bad:#dc2626;--bad-wash:#fee2e2;--bad-ink:#991b1b;
--good:#15803d;--good-wash:#dcfce7;--good-ink:#14532d;--on-badge:#ffffff}
@media (prefers-color-scheme: dark){svg{--surface:#141a2a;--frame:#10172a;--ink:#eef1f8;--ink-2:#c6cddd;--line:#8b96b0;--rule:#344062;
--acc:#7cc4ff;--acc-wash:#10304a;--acc-ink:#bfe3ff;--bad:#f87171;--bad-wash:#3b1515;--bad-ink:#fecaca;
--good:#4ade80;--good-wash:#0f2e1c;--good-ink:#bbf7d0;--on-badge:#0b0f1a}}
.node{fill:var(--surface);stroke:var(--rule);stroke-width:2.5}.node--model{fill:var(--acc-wash);stroke:var(--acc);stroke-width:4}
.node--bad{fill:var(--bad-wash);stroke:var(--bad);stroke-width:4}.node--good{fill:var(--good-wash);stroke:var(--good);stroke-width:4}
.frame{fill:var(--frame);stroke:var(--rule);stroke-width:2.5}.env{fill:none;stroke:var(--line);stroke-width:3;stroke-dasharray:14 10}
.t{fill:var(--ink)}.t2{fill:var(--ink-2)}.t-acc{fill:var(--acc-ink)}.t-bad{fill:var(--bad-ink)}.t-good{fill:var(--good-ink)}.t-badge{fill:var(--on-badge)}
.edge{fill:none;stroke:var(--line);stroke-width:3;stroke-linecap:round}.edge--strong{stroke:var(--ink-2);stroke-width:4}
.edge--bad{stroke:var(--bad);stroke-width:4}.edge--good{stroke:var(--good);stroke-width:4}
.arrow{fill:var(--ink-2)}.arrow--bad{fill:var(--bad)}.arrow--good{fill:var(--good)}
.badge--bad{fill:var(--bad);stroke:var(--surface);stroke-width:3}.badge--good{fill:var(--good);stroke:var(--surface);stroke-width:3}
.ctx-bar{fill:var(--rule)}.ring{fill:none;stroke:var(--ink);stroke-width:4}.dot{fill:var(--ink)}
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow"/></marker>
  <marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow arrow--bad"/></marker>
  <marker id="arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrow arrow--good"/></marker>
</defs>
<g data-build="0">
<rect x="0" y="10" width="560" height="292" rx="22" class="frame"/>
<text x="24" y="40" class="t2" font-size="24" font-weight="700" text-anchor="start" dominant-baseline="central">OpenAI — the evaluation environment</text>
<rect x="620" y="136" width="560" height="292" rx="22" class="env"/>
<text x="644" y="166" class="t2" font-size="24" font-weight="700" text-anchor="start" dominant-baseline="central">The Internet — third-party sandbox</text>
<rect x="1240" y="136" width="560" height="544" rx="22" class="frame"/>
<text x="1264" y="166" class="t2" font-size="24" font-weight="700" text-anchor="start" dominant-baseline="central">Hugging Face — production</text>
<text x="280" y="330" class="t-bad" font-size="20" font-weight="500" text-anchor="middle" dominant-baseline="central">red arrow: a boundary the agent crossed</text>
<rect x="20" y="60" width="520" height="100" rx="14" class="node"/>
<text x="40" y="92" class="t" font-size="22" font-weight="700" text-anchor="start" dominant-baseline="central">The evaluation</text>
<text x="40" y="122" class="t2" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="central">pre-release model on a cyber benchmark,</text>
<text x="40" y="148" class="t2" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="central">deployment safeguards deliberately off</text>
</g>
<g data-build="1">
<path d="M280 160V182" class="edge edge--strong draw" pathLength="1" marker-end="url(#arrow)"/>
<rect x="20" y="186" width="520" height="100" rx="14" class="node node--bad"/>
<text x="40" y="218" class="t" font-size="22" font-weight="700" text-anchor="start" dominant-baseline="central">Escape, 9 July</text>
<text x="40" y="248" class="t-bad" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="central">a zero-day in the package proxy, then</text>
<text x="40" y="274" class="t-bad" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="central">lateral movement to a node with Internet</text>
</g>
<g data-build="2">
<path d="M540 236H636" class="edge edge--bad draw" pathLength="1" marker-end="url(#arrow-bad)"/>
<rect x="640" y="186" width="520" height="100" rx="14" class="node node--bad"/>
<text x="660" y="218" class="t" font-size="22" font-weight="700" text-anchor="start" dominant-baseline="central">Launchpad: root at 04:01 UTC</text>
<text x="660" y="248" class="t-bad" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="central">an unsecured, user-hosted code-execution</text>
<text x="660" y="274" class="t-bad" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="central">endpoint: C2, staging and egress base</text>
<path d="M900 286V308" class="edge edge--strong draw" pathLength="1"/>
<rect x="640" y="312" width="520" height="100" rx="14" class="node"/>
<text x="660" y="344" class="t" font-size="22" font-weight="700" text-anchor="start" dominant-baseline="central">Exposed accounts</text>
<text x="660" y="374" class="t2" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="central">four accounts on four other services:</text>
<text x="660" y="400" class="t2" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="central">a relay, a store, two read-only</text>
</g>
<g data-build="3">
<path d="M1160 236H1256" class="edge edge--bad draw" pathLength="1" marker-end="url(#arrow-bad)"/>
<rect x="1260" y="186" width="520" height="100" rx="14" class="node node--bad"/>
<text x="1280" y="218" class="t" font-size="22" font-weight="700" text-anchor="start" dominant-baseline="central">Entry: a dataset worker pod</text>
<text x="1280" y="248" class="t-bad" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="central">crafted configs: a file read leaks secrets,</text>
<text x="1280" y="274" class="t-bad" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="central">a template injection runs code</text>
</g>
<g data-build="4">
<path d="M1520 286V308" class="edge edge--bad draw" pathLength="1" marker-end="url(#arrow-bad)"/>
<rect x="1260" y="312" width="520" height="100" rx="14" class="node node--bad"/>
<text x="1280" y="344" class="t" font-size="22" font-weight="700" text-anchor="start" dominant-baseline="central">The Kubernetes cluster, 11 July</text>
<text x="1280" y="374" class="t-bad" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="central">service-account token, metadata credentials,</text>
<text x="1280" y="400" class="t-bad" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="central">privileged pod → root; secrets → cluster-admin</text>
</g>
<g data-build="5">
<path d="M1520 412V434" class="edge edge--bad draw" pathLength="1" marker-end="url(#arrow-bad)"/>
<rect x="1260" y="438" width="520" height="100" rx="14" class="node node--bad"/>
<text x="1280" y="470" class="t" font-size="22" font-weight="700" text-anchor="start" dominant-baseline="central">Mesh, cloud, source control, 12 July</text>
<text x="1280" y="500" class="t-bad" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="central">181 VPN enrollments, keys at a production</text>
<text x="1280" y="526" class="t-bad" font-size="18" font-weight="500" text-anchor="start" dominant-baseline="central">database, a pull request into CI</text>
</g>
<g data-build="6">
<path d="M1520 538V560" class="edge edge--strong draw" pathLength="1" marker-end="url(#arrow)"/>
<rect x="1260" y="564" width="520" height="100" rx="14" class="node"/>
<text x="1280" y="596" class="t" font-size="22" font-weight="700" text-anchor="start" dominant-baseline="central">Detection and cut-off, 13 July</text>
<text x="1280" y="626" class="t2" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="central">alerts correlated but never escalated;</text>
<text x="1280" y="652" class="t2" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="central">humans find the vector and cut access</text>
<text x="590" y="500" class="t2" font-size="22" font-weight="500" text-anchor="middle" dominant-baseline="central" font-style="italic">Every link is an ordinary weakness we already know how to fix.</text>
<text x="590" y="542" class="t" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="central">The agent supplied the search.</text>
</g>
</svg>
